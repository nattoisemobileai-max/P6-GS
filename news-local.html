        }

            height: 18px;

            cursor: pointer;
        }

            background: #c1e5c0;
            border-color: #58a700;
        }

            pointer-events: none;
        }

            background: #a5d6a5;
            border-color: #2e7d32;
            border-width: 3px;

          options: ["A. 教練處罰", "B. 網傳霸凌群組包含其他運動員", "C. 退隊風波", "D. 禁藥指控"],
          correct: 1, explanation: "全紅嬋疑遭網路霸凌，流出的群組成員包含其他運動員，引發關注。" },
        { month: 'apr', id: 33, type: 'international', 
          question: "2026年4月10日，日本發布《外交藍皮書》將中國定位改為什麼？",
          options: ["A. 最重要夥伴", "B. 重要鄰國", "C. 潛在威脅", "D. 最大貿易對手"],
          correct: 1, explanation: "日本將中國定位由「最重要雙邊關係」降級為「重要鄰國」，調整外交表述。" },
        
        // ========== 2026年5月 (追加 3題，保持完整) ==========
        { month: 'may', id: 34, type: 'local', 
          question: "2026年5月12日，哪個教學平台遭黑客入侵，導致2.75億用戶資料外泄，本港至少7間院校受影響？",
          options: ["A. Google Classroom", "B. Canvas", "C. Moodle", "D. Zoom for Education"],
          correct: 1, explanation: "教學平台Canvas遭黑客入侵，全球2.75億用戶資料外泄，香港至少7間院校受影響。" },
        { month: 'may', id: 35, type: 'local', 
          question: "2026年5月14日，政府針對大埔宏福苑火災向業主發出什麼行動？",
          options: ["A. 強制搬遷令", "B. 收購建議信及後續發放款項", "C. 罰款通知", "D. 建築禁令"],
          correct: 1, explanation: "政府向宏福苑業主發出收購建議信，並在完成手續後盡早發放款項。" },
        { month: 'may', id: 36, type: 'international', 
          question: "2026年5月13日，美國總統特朗普進行了什麼重大外交行動？",
          options: ["A. 與俄羅斯會談", "B. 相隔九年再度訪華，展開三日國事訪問", "C. 訪問北約總部", "D. 參加G7峰會"],
          correct: 1, explanation: "特朗普相隔九年再度訪華，展開為期三日的國事訪問，國際矚目。" }
    ];
    
    // 月份分組對應名稱
    const monthMap = {
        dec: { title: "2025年12月", count: 0, containerId: "group-dec" },
        jan: { title: "2026年1月", count: 0, containerId: "group-jan" },
        feb: { title: "2026年2月", count: 0, containerId: "group-feb" },
        mar: { title: "2026年3月", count: 0, containerId: "group-mar" },
        apr: { title: "2026年4月", count: 0, containerId: "group-apr" },
        may: { title: "2026年5月", count: 0, containerId: "group-may" }
    };
    
    // 計算各月題數，建立結構
    questionsData.forEach(q => { if(monthMap[q.month]) monthMap[q.month].count++; });
    
    const groupsContainer = document.getElementById('groups-container');
    groupsContainer.innerHTML = '';
    
    // 建立月份區塊
    for (const [key, info] of Object.entries(monthMap)) {
        if (info.count === 0) continue;
        const section = document.createElement('div');
        section.className = 'group-section';
        section.innerHTML = `
            <div class="group-header" onclick="toggleGroup(this)">
                <h3><i class="fas fa-calendar-alt"></i> ${info.title} (${info.count}題)</h3>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="group-content" id="${info.containerId}"></div>
        `;
        groupsContainer.appendChild(section);
    }
    
    // 渲染題目到對應容器
    const groupsDOM = {
        dec: document.getElementById('group-dec'),
        jan: document.getElementById('group-jan'),
        feb: document.getElementById('group-feb'),
        mar: document.getElementById('group-mar'),
        apr: document.getElementById('group-apr'),
        may: document.getElementById('group-may')
    };
    
    questionsData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-${item.id}`;
        let optionsHtml = '';
        item.options.forEach((opt, idx) => {
            optionsHtml += `
                <label class="option" onclick="selectOption(${item.id}, ${idx}, this)">
                    <input type="radio" name="q${item.id}" value="${idx}">
                    ${opt}
                </label>
            `;
        });
        card.innerHTML = `
            <div class="question-header">
                <span class="q-num">${item.id}</span>
                <span class="type-badge ${item.type}">${item.type === 'local' ? '本地' : '國際'}</span>
            </div>
            <div class="question-text">${item.question}</div>
            <div class="options" id="options-${item.id}">${optionsHtml}</div>
            <button class="btn-submit" id="btn-${item.id}" onclick="submitAnswer(${item.id})">提交答案</button>
            <div class="explain-box" id="explain-${item.id}"></div>
        `;
        if (groupsDOM[item.month]) groupsDOM[item.month].appendChild(card);
    });
    
    // 摺疊功能
    window.toggleGroup = function(header) {
        header.classList.toggle('collapsed');
        header.nextElementSibling.classList.toggle('collapsed');
    };
    
    // 選取選項
    window.selectOption = function(qid, optIdx, element) {
        const questionCard = document.getElementById(`q-${qid}`);
        if (questionCard.classList.contains('answered')) return;
        const container = element.closest('.options');
        const labels = container.querySelectorAll('.option');
        labels.forEach(label => label.classList.remove('selected'));
        element.classList.add('selected');
    };
    
    // 提交答案
    window.submitAnswer = function(qid) {
        const questionCard = document.getElementById(`q-${qid}`);
        if (questionCard.classList.contains('answered')) return;
        const question = questionsData.find(q => q.id === qid);
        const options = document.querySelectorAll(`#options-${qid} .option`);
        let selected = null;
        options.forEach((opt, idx) => {
            if (opt.classList.contains('selected')) selected = idx;
        });
        if (selected === null) {
            alert('請先選擇一個答案！');
            return;
        }
        const isCorrect = (selected === question.correct);
        const explainBox = document.getElementById(`explain-${qid}`);
        let correctLetter = String.fromCharCode(65 + question.correct);
        let resultMsg = isCorrect ? '✅ 正確！' : `❌ 錯誤！ 正確答案是 ${correctLetter}`;
        explainBox.innerHTML = `<strong>${resultMsg}</strong><br><strong>🔍 解說：</strong> ${question.explanation}`;
        explainBox.classList.add('show');
        options.forEach((opt, idx) => {
            opt.classList.add('locked');
            if (idx === question.correct) opt.classList.add('correct-answer');
            if (!isCorrect && idx === selected) opt.classList.add('wrong-answer');
        });
        document.getElementById(`btn-${qid}`).disabled = true;
        questionCard.classList.add('answered');
    };
    
    // 調整統計數字以吻合實際題數 (33題)
    document.querySelector('.stats').innerHTML = `<i class="fas fa-star"></i> ${questionsData.length} 題`;
</script>
