<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 時事互動測驗 · 2025-2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            font-size: 18px;
        }

        .quiz-container {
            max-width: 100%;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.5rem 0.3rem;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-home:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b38f1c;
        }

        .quiz-title {
            font-size: 1.4rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quiz-title i {
            color: #3498db;
            font-size: 1.2rem;
        }

        .user-stats {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #2b3c4e;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
        }
        .user-stats i {
            color: #ffd966;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: white;
            border: 2px solid #c1d9f0;
            border-radius: 40px;
            padding: 0.4rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            box-shadow: 0 3px 0 #9bb7d1;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-btn.active {
            background: #3498db;
            color: white;
            border-color: #2c7bb6;
            box-shadow: 0 3px 0 #1f5b8a;
        }
        .filter-btn i {
            font-size: 1rem;
        }

        .group-section {
            margin-bottom: 1.5rem;
            background: white;
            border-radius: 25px;
            box-shadow: 0 6px 0 #9bb7d1;
            border: 2px solid #c1d9f0;
            overflow: hidden;
        }

        .group-header {
            background: #f5faff;
            padding: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #c1d9f0;
        }
        .group-header h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1a4972;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .group-header .count-badge {
            background: #3498db;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            margin-left: 8px;
        }
        .group-header i {
            transition: transform 0.3s;
        }
        .group-header.collapsed i {
            transform: rotate(-90deg);
        }

        .group-content {
            padding: 1rem;
            display: block;
        }
        .group-content.collapsed {
            display: none;
        }

        .question-card {
            background: white;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border-left: 6px solid #3498db;
            box-shadow: 0 4px 0 #bed0e3;
            transition: opacity 0.2s;
        }
        .question-card.hidden {
            display: none;
        }
        .question-card:last-child {
            margin-bottom: 0;
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1f3a4b;
            line-height: 1.4;
            flex: 1;
        }
        .type-badge {
            background: #e1f0fa;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .type-badge.local {
            background: #d5f5e3;
            color: #1f5b3e;
        }
        .type-badge.international {
            background: #fadbd8;
            color: #943126;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f9ff;
            border: 2px solid #cad9eb;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .option input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #9bb7d1;
            border-radius: 50%;
            margin-right: 5px;
            position: relative;
            cursor: pointer;
        }
        .option input[type="radio"]:checked {
            background: #58a700;
            border-color: #58a700;
            box-shadow: inset 0 0 0 4px white;
        }

        .btn-submit {
            background: #3498db;
            border: none;
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 3px 0 #1f5b8a;
            cursor: pointer;
            transition: 0.06s linear;
            margin-top: 0.5rem;
        }
        .btn-submit:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1f5b8a;
        }

        .feedback {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 16px;
            display: none;
        }
        .feedback.correct {
            background: #e8f5e8;
            border-left: 6px solid #2e7d32;
            display: block;
        }
        .feedback.incorrect {
            background: #ffebee;
            border-left: 6px solid #c62828;
            display: block;
        }
        .feedback .supplement {
            margin-top: 0.5rem;
            font-style: italic;
            color: #1f3a4b;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b8baa;
            font-weight: 600;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .top-bar { flex-direction: column; align-items: stretch; }
            .back-home, .quiz-title, .user-stats { justify-content: center; }
            .filter-bar { gap: 0.4rem; }
            .filter-btn { padding: 0.3rem 1rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="top-bar">
        <a href="index-GS.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="quiz-title"><i class="fas fa-calendar-alt"></i> 時事常識 · 2025-2026</span>
        <div class="user-stats">
            <i class="fas fa-star"></i> 每月一測
        </div>
    </div>

    <!-- 篩選按鈕 -->
    <div class="filter-bar">
        <button class="filter-btn active" id="filter-all" onclick="filterQuestions('all')"><i class="fas fa-globe"></i> 全部</button>
        <button class="filter-btn" id="filter-local" onclick="filterQuestions('local')"><i class="fas fa-home"></i> 本地</button>
        <button class="filter-btn" id="filter-intl" onclick="filterQuestions('international')"><i class="fas fa-plane"></i> 國際</button>
    </div>

    <!-- 2025年12月分組 -->
    <div class="group-section" id="group-dec-section">
        <div class="group-header" onclick="toggleGroup(this)">
            <h2><i class="fas fa-calendar-alt"></i> 2025年12月 <span class="count-badge" id="dec-count"></span></h2>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="group-content" id="group-dec"></div>
    </div>

    <!-- 2026年1月分組 -->
    <div class="group-section" id="group-jan-section">
        <div class="group-header" onclick="toggleGroup(this)">
            <h2><i class="fas fa-calendar-alt"></i> 2026年1月 <span class="count-badge" id="jan-count"></span></h2>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="group-content" id="group-jan"></div>
    </div>

    <!-- 2026年2月分組 -->
    <div class="group-section" id="group-feb-section">
        <div class="group-header" onclick="toggleGroup(this)">
            <h2><i class="fas fa-calendar-alt"></i> 2026年2月 <span class="count-badge" id="feb-count"></span></h2>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="group-content" id="group-feb"></div>
    </div>

    <div class="footer-note">
        <i class="fas fa-lightbulb"></i> 每題提交後顯示正確答案與補充資料
    </div>
</div>

            feb: questionsData.filter(q => q.month === 'feb').length
        };

        // 顯示題數
        document.getElementById('dec-count').textContent = `(${counts.dec}題)`;
        document.getElementById('jan-count').textContent = `(${counts.jan}題)`;
        document.getElementById('feb-count').textContent = `(${counts.feb}題)`;

        // 渲染題目
        const groups = {
            dec: document.getElementById('group-dec'),
            jan: document.getElementById('group-jan'),
            feb: document.getElementById('group-feb')
        };

        questionsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.setAttribute('data-qid', item.qid);
            card.setAttribute('data-type', item.type);
            const badgeClass = (item.type === 'local' ? 'local' : 'international');
            const badgeText = (item.type === 'local' ? '本地' : '國際');
            card.innerHTML = `
                <div class="question-header">
                    <div class="question-text">${item.qid}. ${item.question}</div>
                    <span class="type-badge ${badgeClass}"><i class="fas ${item.type === 'local' ? 'fa-home' : 'fa-plane'}"></i> ${badgeText}</span>
                </div>
                <div class="options" id="options-${item.qid}">
                    ${item.options.map((opt, idx) => `
                        <label class="option">
                            <input type="radio" name="q${item.qid}" value="${idx}">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
                <button class="btn-submit" onclick="submitAnswer(${item.qid})">提交</button>
                <div class="feedback" id="feedback-${item.qid}"></div>
            `;
            groups[item.month].appendChild(card);
        });

        // 提交答案函數 (掛在 window 上)
        window.submitAnswer = function(qid) {
            const question = questionsData.find(q => q.qid === qid);
            const options = document.getElementsByName(`q${qid}`);
            let selectedValue = null;
            for (let opt of options) {
                if (opt.checked) {
                    selectedValue = parseInt(opt.value);
                    break;
                }
            }
            const feedbackDiv = document.getElementById(`feedback-${qid}`);
            if (selectedValue === null) {
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.innerHTML = '<strong>請先選擇一個選項！</strong>';
                return;
            }
            const isCorrect = (selectedValue === question.correct);
            const correctLetter = String.fromCharCode(65 + question.correct);
            const supplement = question.supplement;
            feedbackDiv.className = isCorrect ? 'feedback correct' : 'feedback incorrect';
            feedbackDiv.innerHTML = isCorrect 
                ? `<strong>✅ 正確！</strong><div class="supplement">📘 ${supplement}</div>`
                : `<strong>❌ 錯誤！ 正確答案是 ${correctLetter}.</strong><div class="supplement">📘 ${supplement}</div>`;
        };

        // 摺疊功能
        window.toggleGroup = function(header) {
            const content = header.nextElementSibling;
            header.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
        };

        // 篩選功能
        window.filterQuestions = function(type) {
            document.getElementById('filter-all').classList.remove('active');
            document.getElementById('filter-local').classList.remove('active');
            document.getElementById('filter-intl').classList.remove('active');
            if (type === 'all') {
                document.getElementById('filter-all').classList.add('active');
            } else if (type === 'local') {
                document.getElementById('filter-local').classList.add('active');
            } else {
                document.getElementById('filter-intl').classList.add('active');
            }

            const cards = document.querySelectorAll('.question-card');
            cards.forEach(card => {
                const cardType = card.getAttribute('data-type');
                if (type === 'all' || cardType === type) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        };
    };
</script>

<style>
    .group-header.collapsed + .group-content {
        display: none;
    }
    .group-header i {
        transition: transform 0.3s;
    }
    .group-header.collapsed i {
        transform: rotate(-90deg);
    }
    .option {
        user-select: none;
    }
    .option input[type="radio"] {
        accent-color: #58a700;
    }
    .question-card.hidden {
        display: none;
    }
</style>
</body>
</html>
