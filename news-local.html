        * {

            border: 2px solid rgba(255,255,255,0.9);
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 0.8rem;
            border-radius: 60px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-weight: 800;
            font-size: 0.9rem;
            color: #1f3a4b;

            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: 0.05s linear;
        }
        .back-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #b38f1c; }

            font-size: 1.2rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
        }

        .progress-badge {
            background: #2b3c4e;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* 主卡片：一題一題呈現 */
        .question-stage {
            background: #ffffffdd;
            border-radius: 32px;
            padding: 1.2rem;
            margin: 0.8rem 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: all 0.2s;

            display: flex;

            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 1rem;

            font-size: 0.85rem;

            padding: 0.2rem 1rem;

            font-weight: 800;

            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c3e66;

            font-weight: 800;
            color: #0a2f44;
            margin: 1rem 0 1.2rem 0;

            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;

            border-radius: 60px;
            padding: 0.9rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 2px 0 #b3c4d8;
        }
        .option-item:hover:not(.locked-opt) {
            background: #e9f0fe;
            transform: scale(0.99);
        }
        .option-item input {
            width: 20px;
            height: 20px;
            accent-color: #2c7a2d;
            cursor: pointer;
        }
        .option-item.selected-opt {
            background: #c8e6c9;
            border-color: #2e7d32;
            border-width: 3px;
        }
        .option-item.correct-highlight {
            background: #a5d6a7;
            border-color: #1b5e20;
            border-width: 3px;
        }
        .option-item.wrong-highlight {
            background: #ffcdd2;
            border-color: #c62828;
            border-width: 3px;
        }
        .option-item.locked-opt {
            opacity: 0.8;
            cursor: default;
            pointer-events: none;

            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin: 1rem 0 0.5rem;
        }

            background: #facc15;

    </style>

        { month: '2026年4月', id: 27, type: 'local', question: "雅虎香港 (Yahoo HK) 在2026年4月因應全球業務調整，將有何變動？",
          options: ["A. 改名為Yahoo!", "B. 分階段停止香港媒體內容業務", "C. 關閉搜尋引擎", "D. 全面退出亞洲"],
          correct: 1, explanation: "雅虎香港分階段停止在香港的媒體內容業務，因應全球業務重組。" },
        { month: '2026年4月', id: 28, type: 'local', question: "2026年4月3日起，「2元乘車優惠」調整為「兩蚊兩折」方案，具體內容為？",
          options: ["A. 全部車程2元", "B. 票價10元或以下維持2元，超過10元付成人20%", "C. 取消優惠", "D. 改為半價"],
          correct: 1, explanation: "票價$10或以下維持$2，高於$10則付成人票價2折，平衡福利與財政。" },
        { month: '2026年4月', id: 29, type: 'local', question: "政府計劃在古洞北興建聯用綜合大樓，將設立什麼場地？",
          options: ["A. 籃球場及田徑場", "B. 劍擊場地及國際級游泳館", "C. 足球場及健身中心", "D. 溜冰場"],
          correct: 1, explanation: "4月6日公佈計劃興建設有劍擊場地及國際級游泳館的聯用綜合大樓。" },
        { month: '2026年4月', id: 30, type: 'local', question: "2026年4月13日，政府宣佈煞停原定今年9月推出的哪項博彩計劃？",
          options: ["A. 賽馬博彩", "B. 籃球博彩", "C. 足球博彩", "D. 網上賭場"],
          correct: 1, explanation: "政府宣布煞停原定9月推出的籃球博彩計劃，引起社會討論。" },
        { month: '2026年4月', id: 31, type: 'international', question: "2026年4月，荷蘭籍郵輪「洪迪厄斯號」爆發哪種病毒疫情，導致多人死亡？",
          options: ["A. 諾羅病毒", "B. 漢坦病毒", "C. 新冠病毒", "D. 伊波拉病毒"],
          correct: 1, explanation: "郵輪爆發漢坦病毒疫情，導致多人發病及死亡。" },
        { month: '2026年4月', id: 32, type: 'international', question: "2026年4月9日，中國跳水運動員全紅嬋疑遭網路霸凌，事件涉及？",
          options: ["A. 教練處罰", "B. 網傳霸凌群組包含其他運動員", "C. 退隊風波", "D. 禁藥指控"],
          correct: 1, explanation: "全紅嬋疑遭網路霸凌，流出的群組成員包含其他運動員，引發關注。" },
        { month: '2026年4月', id: 33, type: 'international', question: "2026年4月10日，日本發布《外交藍皮書》將中國定位改為什麼？",
          options: ["A. 最重要夥伴", "B. 重要鄰國", "C. 潛在威脅", "D. 最大貿易對手"],
          correct: 1, explanation: "日本將中國定位由「最重要雙邊關係」降級為「重要鄰國」，調整外交表述。" },
        // 2026年5月 (3題)
        { month: '2026年5月', id: 34, type: 'local', question: "2026年5月12日，哪個教學平台遭黑客入侵，導致2.75億用戶資料外泄，本港至少7間院校受影響？",
          options: ["A. Google Classroom", "B. Canvas", "C. Moodle", "D. Zoom for Education"],
          correct: 1, explanation: "教學平台Canvas遭黑客入侵，全球2.75億用戶資料外泄，香港至少7間院校受影響。" },
        { month: '2026年5月', id: 35, type: 'local', question: "2026年5月14日，政府針對大埔宏福苑火災向業主發出什麼行動？",
          options: ["A. 強制搬遷令", "B. 收購建議信及後續發放款項", "C. 罰款通知", "D. 建築禁令"],
          correct: 1, explanation: "政府向宏福苑業主發出收購建議信，並在完成手續後盡早發放款項。" },
        { month: '2026年5月', id: 36, type: 'international', question: "2026年5月13日，美國總統特朗普進行了什麼重大外交行動？",
          options: ["A. 與俄羅斯會談", "B. 相隔九年再度訪華，展開三日國事訪問", "C. 訪問北約總部", "D. 參加G7峰會"],
          correct: 1, explanation: "特朗普相隔九年再度訪華，展開為期三日的國事訪問，國際矚目。" }
    ];

    // ----- 應用狀態 ------
    let currentIndex = 0;           // 當前第幾題 (0-based)
    let answers = new Array(questionsData.length).fill(null);  // 存儲選擇的選項index
    let submittedStatus = new Array(questionsData.length).fill(false); // 該題是否已提交
    let selectedTemp = null;        // 當前題目未提交前的暫存選擇

    const container = document.getElementById('questionContainer');
    const progressSpan = document.getElementById('progressText');

    // 輔助：渲染當前題目
    function renderCurrentQuestion() {
        const q = questionsData[currentIndex];
        const isSubmitted = submittedStatus[currentIndex];
        const savedAnswer = answers[currentIndex];  // 若已提交則為正確/錯誤答案所選索引
        const selectedValue = (isSubmitted && savedAnswer !== null) ? savedAnswer : selectedTemp;

        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            let additionalClass = '';
            let checkedAttr = (selectedValue === idx) ? 'checked' : '';
            let lockClass = (isSubmitted) ? 'locked-opt' : '';
            let highlightClass = '';
            if (isSubmitted) {
                if (idx === q.correct) highlightClass = 'correct-highlight';
                else if (idx === savedAnswer && savedAnswer !== q.correct) highlightClass = 'wrong-highlight';
            } else if (selectedValue === idx) {
                highlightClass = 'selected-opt';
            }
            optionsHtml += `
                <div class="option-item ${lockClass} ${highlightClass}" data-opt-index="${idx}" onclick="handleSelectOption(${idx})">
                    <input type="radio" name="currentQuestion" value="${idx}" ${checkedAttr} ${isSubmitted ? 'disabled' : ''}>
                    <span>${opt}</span>
                </div>
            `;
        });

        const explainHtml = (isSubmitted) ? `
            <div class="explain-card show" id="explainBox">
                <strong>${answers[currentIndex] === q.correct ? '✅ 回答正確！' : '❌ 回答錯誤'}</strong><br>
                <strong>🔍 解說：</strong> ${q.explanation}<br>
                <span style="font-size:0.8rem;">✓ 正確答案：${String.fromCharCode(65+q.correct)}. ${q.options[q.correct]}</span>
            </div>
        ` : '<div class="explain-card" id="explainBox"></div>';

        const submitDisabled = isSubmitted ? 'disabled' : '';
        const nextBtnText = (currentIndex === questionsData.length - 1) ? '🏁 完成測驗' : '下一題 →';

        const html = `
            <div class="question-stage">
                <div class="q-meta">
                    <span class="q-number-badge"><i class="fas fa-pen-alt"></i> 第 ${currentIndex+1} / ${questionsData.length} 題</span>
                    <span class="type-badge ${q.type}">${q.type === 'local' ? '📰 本地時事' : '🌍 國際時事'}</span>
                    <span class="month-tag"><i class="far fa-calendar-alt"></i> ${q.month}</span>
                </div>
                <div class="question-text">${q.question}</div>
                <div class="options-list" id="optionsList">
                    ${optionsHtml}
                </div>
                <div class="action-buttons">
                    <button class="btn-nav btn-primary" id="submitBtn" ${submitDisabled}><i class="fas fa-check-circle"></i> 提交答案</button>
                    <button class="btn-nav btn-secondary" id="nextBtn"><i class="fas fa-arrow-right"></i> ${nextBtnText}</button>
                </div>
                ${explainHtml}
            </div>
        `;
        container.innerHTML = html;
        progressSpan.innerText = `第 ${currentIndex+1} / ${questionsData.length} 題`;

        // 綁定提交事件
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
            submitBtn.onclick = () => handleSubmit();
        }
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.onclick = () => handleNext();
    }

    // 選取選項 (未提交狀態)
    window.handleSelectOption = function(optIdx) {
        if (submittedStatus[currentIndex]) return;
        selectedTemp = optIdx;
        // 重新渲染高亮
        renderCurrentQuestion();
    };

    function handleSubmit() {
        if (submittedStatus[currentIndex]) {
            return;
        }
        if (selectedTemp === null) {
            alert('請先選擇一個答案再提交！');
            return;
        }
        const q = questionsData[currentIndex];
        // 儲存答案
        answers[currentIndex] = selectedTemp;
        submittedStatus[currentIndex] = true;
        // 重新渲染顯示解說、鎖定選項
        renderCurrentQuestion();
    }

    function handleNext() {
        if (!submittedStatus[currentIndex]) {
            alert('請先提交目前題目的答案，再繼續下一題！');
            return;
        }
        if (currentIndex + 1 < questionsData.length) {
            currentIndex++;
            selectedTemp = null;   // 重置暫存選項
            renderCurrentQuestion();
        } else {
            // 完成所有題目，顯示總結
            finishQuiz();
        }
    }

    function finishQuiz() {
        let correctCount = 0;
        for (let i = 0; i < questionsData.length; i++) {
            if (answers[i] !== null && answers[i] === questionsData[i].correct) correctCount++;
        }
        const total = questionsData.length;
        const percentage = Math.round((correctCount/total)*100);
        container.innerHTML = `
            <div class="summary-area">
                <i class="fas fa-trophy" style="font-size: 3rem; color: #f39c12;"></i>
                <h2>📊 測驗完成！</h2>
                <p style="font-size: 1.5rem; font-weight: 800; margin: 1rem 0;">${correctCount} / ${total} 正確</p>
                <div style="background:#e2e8f0; border-radius: 40px; height: 12px; width: 100%; margin: 1rem 0;"><div style="background:#2ecc71; width: ${percentage}%; height: 12px; border-radius: 40px;"></div></div>
                <p>${percentage >= 80 ? '🌟 時事小達人！太厲害了' : percentage >= 60 ? '👍 不錯喔！再複習一下會更強' : '📚 再挑戰一次，關注時事增加常識'}</p>
                <button class="btn-nav btn-primary" id="restartQuiz" style="margin-top: 1rem;"><i class="fas fa-redo-alt"></i> 重新挑戰</button>
            </div>
        `;
        document.getElementById('restartQuiz')?.addEventListener('click', () => {
            // 重置所有狀態
            currentIndex = 0;
            answers = new Array(questionsData.length).fill(null);
            submittedStatus = new Array(questionsData.length).fill(false);
            selectedTemp = null;
            renderCurrentQuestion();
        });
        progressSpan.innerText = `完成 / ${total} 題`;
    }

    // 初始化渲染
    renderCurrentQuestion();
</script>
</body>
</html>
