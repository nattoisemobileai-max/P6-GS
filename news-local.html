<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 時事互動測驗</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0.5rem;
            font-size: 16px;
        }

        .test-container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 1rem;
            box-shadow: 0 20px 30px -10px rgba(0,40,60,0.4);
            border: 2px solid rgba(255,255,255,0.8);
        }

        .test-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #b38f1c; }

        .test-title {
            font-size: 1.3rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
        }

        .stats {
            background: #2b3c4e;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .group-section {
            margin-bottom: 1rem;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 0 #9bb7d1;
            border: 1px solid #c1d9f0;
        }

        .group-header {
            background: #e1f0fa;
            padding: 0.8rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #9bb7d1;
        }
        .group-header h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a4972;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .group-header i {
            transition: transform 0.3s;
        }
        .group-header.collapsed i {
            transform: rotate(-90deg);
        }

        .group-content {
            padding: 0.5rem;
            display: block;
        }
        .group-content.collapsed {
            display: none;
        }

        .question-card {
            background: #f8fafd;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border: 1px solid #e0e8f0;
            transition: all 0.2s;
        }
        .question-card:last-child {
            margin-bottom: 0;
        }
        .question-card.answered {
            background: #f0f7ff;
            border-left: 4px solid #3498db;
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .q-num {
            background: #3498db;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .type-badge {
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .type-badge.local {
            background: #d5f5e3;
            color: #1f5b3e;
        }
        .type-badge.international {
            background: #fadbd8;
            color: #943126;
        }

        .question-text {
            font-weight: 700;
            color: #1f3a4b;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        .option {
            background: white;
            border: 2px solid #cad9eb;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 0 #9fbad0;
        }
        .option:hover:not(.locked) {
            background: #e1efff;
        }
        .option input {
            width: 18px;
            height: 18px;
            accent-color: #58a700;
            cursor: pointer;
        }
        .option.selected {
            background: #c1e5c0;
            border-color: #58a700;
        }
        .option.locked {
            opacity: 0.7;
            cursor: default;
            pointer-events: none;
        }
        .option.correct-answer {
            background: #a5d6a5;
            border-color: #2e7d32;
            border-width: 3px;
        }
        .option.wrong-answer {
            background: #ffcdd2;
            border-color: #c62828;
            border-width: 3px;
        }

        .btn-submit {
            background: #58a700;
            border: none;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 #3e7a00;
            cursor: pointer;
            width: fit-content;
            margin-top: 0.5rem;
            transition: 0.05s;
        }
        .btn-submit:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #3e7a00;
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .explain-box {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-radius: 12px;
            background: #fff9e6;
            border-left: 4px solid #f3b33d;
            font-size: 0.9rem;
            display: none;
        }
        .explain-box.show {
            display: block;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b8baa;
            font-size: 0.9rem;
        }

        .hidden { display: none; }
    </style>
</head>

          correct: 3, explanation: "調查指出防塵網燃燒產生的碎屑成為了跨樓層蔓延的導火線。這與大廈正在進行的維修工程物料有關。" },

          options: ["A. 全球數字貨幣白皮書", "B. 香港旅遊發展藍圖 2050", "C. 香港首份「五年規劃」", "D. 強制全民健身計劃綱要"],
          correct: 2, explanation: "旨在將年度施政報告提升為具系統性、對接國家戰略的長遠規劃。" },
        { month: 'mar', id: 36, type: 'local', question: "報告提到香港的財政儲備預計為 6,572 億港元。這筆錢大約足夠支付政府幾個月的開支？",
          options: ["A. 12 個月", "B. 3 個月", "C. 24 個月", "D. 8 個月"],
          correct: 3, explanation: "雖然儲備有所回落，但仍足以維持約 8 個月的開支，顯示財政相對穩健。" },

        // 2026年4月 (1題)
        { month: 'apr', id: 33, type: 'local', question: "2026 年 4 月起，「二元乘車優惠」將如何調整？",
          options: ["A. 改為「免費乘車」，無需支付任何費用", "B. 實施「兩蚊兩折」方案，10 元以上車程需付原價 20%", "C. 完全取消所有交通優惠，恢復原價", "D. 僅限於周日使用，平日需付全費"],
          correct: 1, explanation: "這項方案體現了福利承諾與財政責任之間的平衡。" }
    ];

    // 渲染題目
    const groups = {
        dec: document.getElementById('group-dec'),
        jan: document.getElementById('group-jan'),
        feb: document.getElementById('group-feb'),
        mar: document.getElementById('group-mar'),
        apr: document.getElementById('group-apr')
    };

    questionsData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-${item.id}`;
        
        let optionsHtml = '';
        item.options.forEach((opt, idx) => {
            optionsHtml += `
                <label class="option" onclick="selectOption(${item.id}, ${idx}, this)">
                    <input type="radio" name="q${item.id}" value="${idx}">
                    ${opt}
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-header">
                <span class="q-num">${item.id}</span>
                <span class="type-badge ${item.type}">${item.type === 'local' ? '本地' : '國際'}</span>
            </div>
            <div class="question-text">${item.question}</div>
            <div class="options" id="options-${item.id}">${optionsHtml}</div>
            <button class="btn-submit" id="btn-${item.id}" onclick="submitAnswer(${item.id})">提交答案</button>
            <div class="explain-box" id="explain-${item.id}"></div>
        `;
        groups[item.month].appendChild(card);
    });

    // 摺疊功能
    window.toggleGroup = function(header) {
        header.classList.toggle('collapsed');
        header.nextElementSibling.classList.toggle('collapsed');
    };

    // 選取選項
    window.selectOption = function(qid, optIdx, element) {
        const questionCard = document.getElementById(`q-${qid}`);
        if (questionCard.classList.contains('answered')) return; // 已答題不可再選
        
        const container = element.closest('.options');
        const labels = container.querySelectorAll('.option');
        labels.forEach(label => label.classList.remove('selected'));
        element.classList.add('selected');
    };

    // 提交答案
    window.submitAnswer = function(qid) {
        const questionCard = document.getElementById(`q-${qid}`);
        if (questionCard.classList.contains('answered')) return;

        const question = questionsData.find(q => q.id === qid);
        const options = document.querySelectorAll(`#options-${qid} .option`);
        let selected = null;

        options.forEach((opt, idx) => {
            if (opt.classList.contains('selected')) {
                selected = idx;
            }
        });

        if (selected === null) {
            alert('請先選擇一個答案！');
            return;
        }

        const isCorrect = (selected === question.correct);
        const explainBox = document.getElementById(`explain-${qid}`);
        
        let correctLetter = String.fromCharCode(65 + question.correct);
        let resultMsg = isCorrect ? '✅ 正確！' : `❌ 錯誤！ 正確答案是 ${correctLetter}`;
        
        explainBox.innerHTML = `
            <strong>${resultMsg}</strong><br>
            <strong>🔍 解說：</strong> ${question.explanation}
        `;
        explainBox.classList.add('show');

        // 標示正確答案和錯誤選擇
        options.forEach((opt, idx) => {
            opt.classList.add('locked');
            if (idx === question.correct) {
                opt.classList.add('correct-answer');
            }
            if (!isCorrect && idx === selected) {
                opt.classList.add('wrong-answer');
            }
        });

        document.getElementById(`btn-${qid}`).disabled = true;
        questionCard.classList.add('answered');
    };
</script>
