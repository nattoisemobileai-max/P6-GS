<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 測驗 · 綜合題庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.3rem;
            font-size: 16px;
        }

        .test-container {
            max-width: 550px;
            width: 100%;
            height: 98vh;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 30px -10px rgba(0,40,60,0.4);
            padding: 0.8rem;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .test-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 0.5rem;
            box-shadow: 0 3px 0 #bed0e3;
            flex-shrink: 0;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }
        .back-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #b38f1c; }

        .test-title {
            font-size: 1.2rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
        }

        .test-stats {
            display: flex;
            gap: 0.5rem;
            background: #2b3c4e;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            align-items: center;
        }
        .test-stats i {
            color: #ffd966;
        }

        .filter-section {
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }
        .filter-title {
            font-size: 0.9rem;
            color: #2c5a7a;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
        }
        .filter-btn {
            background: white;
            border: 2px solid #c1d9f0;
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f3a4b;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 0 #9fbad0;
            flex: 0 1 auto;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #3498db;
            color: white;
            border-color: #2c7bb6;
        }
        .filter-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9fbad0;
        }

        .progress-section {
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.2rem;
            font-weight: 600;
            color: #2c5a7a;
            font-size: 0.9rem;
        }
        .progress-bar-bg {
            height: 16px;
            background: #e2eaf3;
            border-radius: 30px;
            overflow: hidden;
            width: 100%;
        }
        .progress-correct {
            height: 100%;
            background: #58cc71;
            transition: width 0.3s;
            width: 0%;
            border-radius: 30px;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 0.3rem;
        }

        .question-card {
            background: white;
            border-radius: 24px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 0 #a0b9cf, 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #fff6cf;
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .question-number {
            background: #3498db;
            color: white;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .type-badge {
            background: #f4d03f;
            color: #1f3a4b;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3f5a;
            margin-bottom: 1rem;
            line-height: 1.4;
            padding-left: 0.3rem;
            border-left: 4px solid #f3b33d;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .option-item {
            background: #f5f9ff;
            border: 2px solid #cad9eb;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            color: #1f4973;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 0 #9fbad0;
        }
        .option-item:hover {
            background: #e1efff;
        }
        .option-item input[type="radio"], 
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #58a700;
            cursor: pointer;
        }
        .option-item.disabled {
            opacity: 0.7;
            cursor: default;
        }
        .option-item.correct-highlight {
            background: #c1e5c0;
            border-color: #58a700;
        }
        .option-item.incorrect-highlight {
            background: #ffcdd2;
            border-color: #c62828;
        }

        .essay-input, .short-input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #cad9eb;
            border-radius: 20px;
            font-size: 0.95rem;
            margin: 0.5rem 0;
            resize: vertical;
            font-family: inherit;
        }
        .essay-input {
            min-height: 100px;
        }

        .submit-area {
            display: flex;
            gap: 0.5rem;
            margin: 0.8rem 0 0.5rem;
        }
        .btn-submit {
            background: #58a700;
            border: none;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 3px 0 #3e7a00;
            cursor: pointer;
            flex: 1;
        }
        .btn-submit:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #3e7a00;
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-radius: 16px;
            background: #fff9e6;
            border-left: 4px solid #f3b33d;
            font-size: 0.9rem;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .correct-msg { color: #2e7d32; font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; }
        .incorrect-msg { color: #c62828; font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; }
        .explanation-line {
            margin: 0.3rem 0;
            padding-left: 0.5rem;
            border-left: 2px solid #f3b33d;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.3rem;
            flex-shrink: 0;
        }
        .nav-btn {
            background: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #1f4973;
            box-shadow: 0 3px 0 #9fbad0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            justify-content: center;
        }
        .nav-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #9fbad0; }
        .nav-btn.primary { background: #58a700; color: white; box-shadow: 0 3px 0 #3e7a00; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .question-indicator {
            background: #e1edff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1a4972;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .footer-note {
            text-align: center;
            margin-top: 0.5rem;
            color: #6b8baa;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="test-container">
    <div class="test-header">
        <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="test-title" id="lesson-title">綜合題庫</span>
        <div class="test-stats">
            <span><i class="fas fa-star"></i> <span id="score">0</span>/<span id="total">0</span></span>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-title"><i class="fas fa-filter"></i> 題型篩選</div>
        <div class="filter-buttons" id="filter-buttons">
            <button class="filter-btn active" data-filter="random20">🎲 隨機20題</button>
            <button class="filter-btn" data-filter="all">📚 全部題目</button>
            <button class="filter-btn" data-filter="mc">🔘 單選題</button>
            <button class="filter-btn" data-filter="checkbox">✅ 複選題</button>
            <button class="filter-btn" data-filter="truefalse">✓ 是非題</button>
            <button class="filter-btn" data-filter="essay">📝 論述題</button>
            <button class="filter-btn" data-filter="short">✏️ 簡答題</button>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-info">
            <span><span id="correctCount">0</span> 正確 · <span id="wrongCount">0</span> 錯誤</span>
            <span id="completionPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-correct" id="progressCorrect" style="width:0%"></div>
        </div>
    </div>

    <div class="scrollable-content" id="contentArea"></div>

    <div class="navigation">
        <button class="nav-btn" id="prevBtn" disabled><i class="fas fa-chevron-left"></i> 上一題</button>
        <span class="question-indicator" id="questionIndicator">1/0</span>
        <button class="nav-btn primary" id="nextBtn" disabled>下一題 <i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="footer-note">
        <i class="fas fa-lightbulb"></i> 單選題點選即評分，複選題需點「提交答案」
    </div>
</div>

<script>
    let allQuestions = [];
    let currentQuestions = [];
    let userAnswers = {};
    let answeredStatus = {};
    let correctCount = 0, wrongCount = 0;
    let currentIndex = 0;

    const contentArea = document.getElementById('contentArea');
    const lessonTitle = document.getElementById('lesson-title');
    const scoreSpan = document.getElementById('score');
    const totalSpan = document.getElementById('total');
    const correctCountSpan = document.getElementById('correctCount');
    const wrongCountSpan = document.getElementById('wrongCount');
    const progressCorrect = document.getElementById('progressCorrect');
    const completionPercent = document.getElementById('completionPercent');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionIndicator = document.getElementById('questionIndicator');
    const filterBtns = document.querySelectorAll('.filter-btn');

    async function loadQuestions() {
        try {
            const res = await fetch('test-data.json');
            if (!res.ok) throw new Error('無法載入題庫');
            const data = await res.json();
            
            allQuestions = data.questions.map(q => {
                let type = 'unknown';
                if (q.type) {
                    type = q.type;
                } else if (typeof q.correctAnswer === 'boolean') {
                    type = 'truefalse';
                } else if (Array.isArray(q.correctAnswer)) {
                    type = 'checkbox';
                } else if (typeof q.correctAnswer === 'number') {
                    type = 'mc';
                } else if (q.keywords) {
                    type = 'short';
                } else {
                    type = 'essay';
                }
                return { ...q, type };
            });
            
            lessonTitle.textContent = data.lessonTitle || '綜合題庫';
            totalSpan.textContent = allQuestions.length;
            filterQuestions('random20');
            
        } catch (error) {
            contentArea.innerHTML = `<div style="color:#c62828; padding:1rem;">❌ 載入失敗：${error.message}</div>`;
        }
    }

    function getTypeName(type) {
        const names = {
            'mc': '單選',
            'checkbox': '複選',
            'truefalse': '是非',
            'essay': '論述',
            'short': '簡答'
        };
        return names[type] || type;
    }

    function getTypeIcon(type) {
        const icons = {
            'mc': '🔘',
            'checkbox': '✅',
            'truefalse': '✓',
            'essay': '📝',
            'short': '✏️'
        };
        return icons[type] || '📌';
    }

    function formatExplanation(explanation) {
        if (!explanation) return '';
        
        // 將解說按選項分行 (A., B., C., D.)
        const lines = explanation.split(/(?=[A-D]\.)/g);
        let formatted = '';
        lines.forEach(line => {
            if (line.trim()) {
                formatted += `<div class="explanation-line">${line.trim()}</div>`;
            }
        });
        return formatted;
    }

    function filterQuestions(filterType) {
        filterBtns.forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === filterType) {
                btn.classList.add('active');
            }
        });

        let questionIndices = [];
        
        if (filterType === 'random20') {
            const total = allQuestions.length;
            const count = Math.min(20, total);
            const indices = new Set();
            while (indices.size < count) {
                indices.add(Math.floor(Math.random() * total));
            }
            questionIndices = Array.from(indices);
        } else {
            let filteredIndices = [];
            if (filterType === 'all') {
                filteredIndices = allQuestions.map((_, idx) => idx);
            } else {
                filteredIndices = allQuestions
                    .map((q, idx) => ({ type: q.type, idx }))
                    .filter(item => item.type === filterType)
                    .map(item => item.idx);
            }
            questionIndices = filteredIndices;
        }

        currentQuestions = questionIndices;
        userAnswers = {};
        answeredStatus = {};
        correctCount = 0;
        wrongCount = 0;
        currentIndex = 0;
        updateStats();

        if (currentQuestions.length === 0) {
            contentArea.innerHTML = '<div style="text-align:center; padding:2rem;">📭 沒有符合條件的題目</div>';
            questionIndicator.textContent = `0/0`;
            nextBtn.disabled = true;
            prevBtn.disabled = true;
            return;
        }

        questionIndicator.textContent = `1/${currentQuestions.length}`;
        nextBtn.disabled = false;
        renderQuestion(0);
    }

    function renderQuestion(index) {
        if (currentQuestions.length === 0) return;
        
        const qIdx = currentQuestions[index];
        const q = allQuestions[qIdx];
        const hasAnswered = answeredStatus[index] === true;
        
        let html = `
            <div class="question-card">
                <div class="question-header">
                    <span class="question-number">第 ${index+1}/${currentQuestions.length} 題</span>
                    <span class="type-badge">${getTypeIcon(q.type)} ${getTypeName(q.type)}</span>
                </div>
                <div class="question-text">${q.question}</div>
        `;

        if (q.type === 'mc' || q.type === 'checkbox' || q.type === 'truefalse') {
            html += '<div class="options-grid" id="options-container">';
            
            let options = q.options;
            if (q.type === 'truefalse' && (!options || options.length === 0)) {
                options = ['正確', '錯誤'];
            }
            
            options.forEach((opt, optIdx) => {
                const inputType = q.type === 'checkbox' ? 'checkbox' : 'radio';
                const name = q.type === 'checkbox' ? `q${index}_${optIdx}` : `q${index}`;
                const isChecked = userAnswers[index] && 
                    (Array.isArray(userAnswers[index]) 
                        ? userAnswers[index].includes(optIdx)
                        : userAnswers[index] === optIdx);
                
                let extraClass = '';
                if (hasAnswered) {
                    // 顯示正確答案（綠色）
                    if (Array.isArray(q.correctAnswer) && q.correctAnswer.includes(optIdx)) {
                        extraClass = ' correct-highlight';
                    } else if (!Array.isArray(q.correctAnswer) && q.correctAnswer === optIdx) {
                        extraClass = ' correct-highlight';
                    }
                    
                    // 顯示使用者選錯的選項（紅色）
                    if (userAnswers[index] && !userAnswers[index].isCorrect) {
                        if (Array.isArray(userAnswers[index]) && userAnswers[index].includes(optIdx) && 
                            !(Array.isArray(q.correctAnswer) && q.correctAnswer.includes(optIdx))) {
                            extraClass = ' incorrect-highlight';
                        } else if (!Array.isArray(userAnswers[index]) && userAnswers[index] === optIdx && 
                                  userAnswers[index] !== q.correctAnswer) {
                            extraClass = ' incorrect-highlight';
                        }
                    }
                }
                
                html += `
                    <label class="option-item ${hasAnswered ? 'disabled' : ''} ${extraClass}">
                        <input type="${inputType}" name="${name}" value="${optIdx}" 
                            ${isChecked ? 'checked' : ''} 
                            ${hasAnswered ? 'disabled' : ''}
                            onchange="${q.type === 'checkbox' 
                                ? `handleCheckboxChange(${index}, ${optIdx}, this)` 
                                : (q.type === 'truefalse' || q.type === 'mc') && !hasAnswered 
                                    ? `handleRadioChange(${index}, ${optIdx})` 
                                    : ''}">
                        ${opt}
                    </label>
                `;
            });
            
            html += '</div>';
            
            if (q.type === 'checkbox' && !hasAnswered) {
                html += `<div class="submit-area"><button class="btn-submit" onclick="submitCheckbox(${index})">提交答案</button></div>`;
            }
            
        } else if (q.type === 'essay') {
            html += `
                <textarea class="essay-input" id="essay-${index}" placeholder="請輸入你的論述..." ${hasAnswered ? 'disabled' : ''}>${userAnswers[index] || ''}</textarea>
                ${!hasAnswered ? '<div class="submit-area"><button class="btn-submit" onclick="submitEssay('+index+')">提交答案</button></div>' : ''}
            `;
        } else if (q.type === 'short') {
            html += `
                <input type="text" class="short-input" id="short-${index}" placeholder="請輸入簡短答案" value="${userAnswers[index] || ''}" ${hasAnswered ? 'disabled' : ''}>
                ${!hasAnswered ? '<div class="submit-area"><button class="btn-submit" onclick="submitShort('+index+')">提交答案</button></div>' : ''}
            `;
        }

        // 顯示結果（如果已答）
        if (hasAnswered) {
            html += `<div class="result-box show" id="result-${index}">`;
            const isCorrect = userAnswers[index]?.isCorrect;
            html += `<p class="${isCorrect ? 'correct-msg' : 'incorrect-msg'}">
                ${isCorrect ? '✅ 正確！' : '❌ 錯誤！'}
            </p>`;
            
            if (q.explanation) {
                html += formatExplanation(q.explanation);
            }
            
            // 如果是答錯，顯示正確答案提示
            if (!isCorrect && q.correctAnswer !== undefined) {
                if (Array.isArray(q.correctAnswer)) {
                    const correctLetters = q.correctAnswer.map(idx => String.fromCharCode(65 + idx)).join('、');
                    html += `<div class="explanation-line"><strong>正確答案：</strong> ${correctLetters}</div>`;
                } else if (typeof q.correctAnswer === 'number') {
                    const correctLetter = String.fromCharCode(65 + q.correctAnswer);
                    html += `<div class="explanation-line"><strong>正確答案：</strong> ${correctLetter}</div>`;
                } else if (typeof q.correctAnswer === 'boolean') {
                    html += `<div class="explanation-line"><strong>正確答案：</strong> ${q.correctAnswer ? '正確' : '錯誤'}</div>`;
                }
            }
            
            html += `</div>`;
        } else {
            html += `<div class="result-box" id="result-${index}"></div>`;
        }

        html += '</div>';
        contentArea.innerHTML = html;

        questionIndicator.textContent = `${index+1}/${currentQuestions.length}`;
        prevBtn.disabled = index === 0;
    }

    window.handleRadioChange = function(index, value) {
        if (answeredStatus[index]) return;
        
        const qIdx = currentQuestions[index];
        const q = allQuestions[qIdx];
        const isCorrect = (value === q.correctAnswer);
        
        userAnswers[index] = value;
        userAnswers[index].isCorrect = isCorrect;
        answeredStatus[index] = true;
        updateScore(isCorrect);
        renderQuestion(index);
    };

    window.handleCheckboxChange = function(index, value, checkbox) {
        if (answeredStatus[index]) return;
        
        if (!userAnswers[index]) userAnswers[index] = [];
        
        if (checkbox.checked) {
            userAnswers[index].push(value);
        } else {
            userAnswers[index] = userAnswers[index].filter(v => v !== value);
        }
    };

    window.submitCheckbox = function(index) {
        if (answeredStatus[index] || !userAnswers[index] || userAnswers[index].length === 0) {
            alert('請至少選擇一個選項');
            return;
        }
        
        const qIdx = currentQuestions[index];
        const q = allQuestions[qIdx];
        const correct = q.correctAnswer;
        
        const isCorrect = userAnswers[index].length === correct.length &&
            userAnswers[index].every(v => correct.includes(v)) &&
            correct.every(v => userAnswers[index].includes(v));
        
        userAnswers[index].isCorrect = isCorrect;
        answeredStatus[index] = true;
        updateScore(isCorrect);
        renderQuestion(index);
    };

    window.submitEssay = function(index) {
        const textarea = document.getElementById(`essay-${index}`);
        if (!textarea.value.trim()) {
            alert('請輸入內容');
            return;
        }
        
        userAnswers[index] = textarea.value;
        userAnswers[index].isCorrect = false;
        answeredStatus[index] = true;
        updateScore(false);
        renderQuestion(index);
    };

    window.submitShort = function(index) {
        const input = document.getElementById(`short-${index}`);
        if (!input.value.trim()) {
            alert('請輸入答案');
            return;
        }
        
        const qIdx = currentQuestions[index];
        const q = allQuestions[qIdx];
        const userAns = input.value.trim().toLowerCase();
        
        let isCorrect = false;
        if (q.keywords) {
            isCorrect = q.keywords.some(k => userAns.includes(k.toLowerCase()));
        }
        
        userAnswers[index] = input.value;
        userAnswers[index].isCorrect = isCorrect;
        answeredStatus[index] = true;
        updateScore(isCorrect);
        renderQuestion(index);
    };

    function updateScore(isCorrect) {
        if (isCorrect) {
            correctCount++;
        } else {
            wrongCount++;
        }
        updateStats();
    }

    function updateStats() {
        const totalAnswered = Object.keys(answeredStatus).length;
        const percent = currentQuestions.length ? Math.round((totalAnswered / currentQuestions.length) * 100) : 0;
        
        correctCountSpan.textContent = correctCount;
        wrongCountSpan.textContent = wrongCount;
        scoreSpan.textContent = correctCount;
        progressCorrect.style.width = percent + '%';
        completionPercent.textContent = percent + '%';
    }

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            if (Object.keys(answeredStatus).length === currentQuestions.length) {
                alert(`測驗完成！\n正確：${correctCount} 題\n錯誤：${wrongCount} 題`);
            }
        }
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterQuestions(btn.dataset.filter);
        });
    });

    loadQuestions();
</script>
</body>
</html>
