        { subtopic:"瀕危物種舉例", question:"黑臉琵鷺和綠海龜在香港被視為瀕危物種。", options:["True","False"], correctAnswer:0, explanation:"筆記明確舉例。" },
        { subtopic:"漁業預測", question:"過度捕魚可能導致2048年漁業資源耗盡。", options:["True","False"], correctAnswer:0, explanation:"科學家預測2048年耗盡。" },
        { subtopic:"生產者消失", question:"若植物全部消失，後續連鎖反應？", options:["獅子改喝水存活","斑馬遷徙他處","其他掠食者填補","斑馬無食物死亡，獅子餓死"], correctAnswer:3, explanation:"植物消失→斑馬死亡→獅子餓死，生態崩潰。" },
        { subtopic:"環保實踐", question:"哪項符合環境保育原則？", options:["使用野生紅木家具","減少塑膠吸管及一次性用品","向非法商購買放生","採集野生花草裝飾"], correctAnswer:1, explanation:"減少一次性用品降低污染。" },
        { subtopic:"森林棲息地", question:"大規模砍伐森林會破壞生物棲息地。", options:["True","False"], correctAnswer:0, explanation:"直接破壞棲息地。" },
        { subtopic:"野生製品", question:"保護環境應多購買來源不明野生動植物製品。", options:["True","False"], correctAnswer:1, explanation:"應拒絕購買來源不明製品，避免助長獵捕。" }
    ];

    // 全域狀態
    let currentQuestions = [];       // 儲存目前測驗的題目物件
    let userSelections = [];         // 每題選項索引
    let questionResults = [];        // 'unanswered', 'correct', 'incorrect'
    let totalScore = 0;
    let currentQIndex = 0;
    let miniGameLock = false;
    let lastMilestone = 0;
    const POINTS_PER = 5;

    // DOM 元素
    const startScreen = document.getElementById('startScreen');
    const questionArea = document.getElementById('questionArea');
    const summaryArea = document.getElementById('summaryArea');
    const navDiv = document.getElementById('navButtons');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resultsBtn = document.getElementById('showResultsBtn');
    const qIndicator = document.getElementById('questionIndicator');
    const earnedSpan = document.getElementById('earnedPoints');
    const totalPointsSpan = document.getElementById('totalPoints');
    const correctSpan = document.getElementById('correctCount');
    const wrongSpan = document.getElementById('wrongCount');
    const progressFill = document.getElementById('progressCorrect');
    const percentSpan = document.getElementById('completionPercent');

    function updateStatsUI() {
        const total = currentQuestions.length;
        const correct = questionResults.filter(s => s === 'correct').length;
        const wrong = questionResults.filter(s => s === 'incorrect').length;
        correctSpan.innerText = correct;
        wrongSpan.innerText = wrong;
        const percent = total ? (correct / total) * 100 : 0;
        progressFill.style.width = `${percent}%`;
        percentSpan.innerText = `${Math.round(percent)}%`;
        earnedSpan.innerText = totalScore;
        totalPointsSpan.innerText = total * POINTS_PER;

        // 觸發小遊戲：每答對10題觸發一次（但不重複）
        if (!miniGameLock && correct >= 10) {
            const milestone = Math.floor(correct / 10);
            if (milestone > lastMilestone) {
                lastMilestone = milestone;
                launchMiniGame();
            }
        }
    }

    // 小遊戲: 60秒點擊莓果，結束後增加生態幣
    function launchMiniGame() {
        if (miniGameLock) return;
        miniGameLock = true;
        const overlay = document.createElement('div');
        overlay.className = 'minigame-overlay';
        overlay.innerHTML = `
            <div class="minigame-card">
                <h2 style="color:#2c6e5c;">🍓 生態救援·莓果大豐收</h2>
                <p>點擊莓果獲得生態幣！限時60秒</p>
                <div class="mg-timer" id="mgTimer">60</div>
                <div>🍒 得分 🫐</div>
                <div class="mg-score" id="mgScore">0</div>
                <div class="berry-grid" id="berryGrid"></div>
                <button class="mg-start-btn" id="startMgBtn">🎯 開始挑戰 60秒</button>
            </div>
        `;
        document.body.appendChild(overlay);
        let gameActive = false;
        let gameScore = 0;
        let timeLeft = 60;
        let countdown = null;
        const timerEl = overlay.querySelector('#mgTimer');
        const scoreEl = overlay.querySelector('#mgScore');
        const berryGrid = overlay.querySelector('#berryGrid');
        const startBtn = overlay.querySelector('#startMgBtn');

        function stopGame() {
            if (countdown) clearInterval(countdown);
            gameActive = false;
            overlay.remove();
            totalScore += gameScore;
            updateStatsUI();
            alert(`🎉 小遊戲結束！你收集了 ${gameScore} 顆莓果，獲得 ${gameScore} 生態幣！`);
            miniGameLock = false;
            if (currentQuestions.length > 0 && currentQIndex < currentQuestions.length) {
                renderCurrentQuestion();
            }
        }

        function startGame() {
            if (gameActive) return;
            gameActive = true;
            gameScore = 0;
            timeLeft = 60;
            scoreEl.innerText = '0';
            timerEl.innerText = '60';
            berryGrid.innerHTML = '';
            const fruits = ['🍓', '🫐', '🍒', '🍇', '🍑'];
            for (let i = 0; i < 9; i++) {
                const fruit = fruits[Math.floor(Math.random() * fruits.length)];
                const btn = document.createElement('button');
                btn.className = 'berry-btn';
                btn.innerHTML = fruit;
                btn.onclick = () => {
                    if (!gameActive) return;
                    gameScore++;
                    scoreEl.innerText = gameScore;
                    btn.innerHTML = '✨';
                    setTimeout(() => { if (btn && gameActive) btn.innerHTML = fruit; }, 150);
                };
                berryGrid.appendChild(btn);
            }
            countdown = setInterval(() => {
                if (!gameActive) return;
                if (timeLeft <= 1) {
                    clearInterval(countdown);
                    gameActive = false;
                    stopGame();
                } else {
                    timeLeft--;
                    timerEl.innerText = timeLeft;
                }
            }, 1000);
        }
        startBtn.onclick = startGame;
    }

    function renderCurrentQuestion() {
        if (miniGameLock) return;
        const q = currentQuestions[currentQIndex];
        const letters = ['A', 'B', 'C', 'D'];
        let optsHtml = '';
        q.options.forEach((opt, idx) => {
            let extraClass = '';
            if (questionResults[currentQIndex] !== 'unanswered') {
                if (idx === q.correctAnswer) extraClass = 'correct';
                else if (idx === userSelections[currentQIndex]) extraClass = 'incorrect';
            }
            const disabledAttr = questionResults[currentQIndex] !== 'unanswered' ? 'disabled' : '';
            optsHtml += `
                <button class="option-btn ${extraClass}" onclick="window.selectAnswer(${currentQIndex}, ${idx})" ${disabledAttr}>
                    <span class="option-prefix">${letters[idx]}</span> ${opt}
                </button>
            `;
        });
        const typeLabel = (q.options.length === 2 && (q.options[0] === 'True' || q.options[0] === 'True')) ? '✔️ 是非題' : '🔬 選擇題';
        let html = `
            <div class="question-card">
                <div class="question-header">
                    <span class="question-number">第 ${currentQIndex+1}/${currentQuestions.length} 題</span>
                    <span class="subtopic-badge"><i class="fas fa-tag"></i> ${q.subtopic}</span>
                </div>
                <div class="question-text">${q.question}</div>
                <div class="options-grid">${optsHtml}</div>
        `;
        if (questionResults[currentQIndex] !== 'unanswered') {
            html += `<div class="explanation-box" style="background:#fff9e6; border-left:6px solid #f3b33d; border-radius:12px; padding:0.6rem; margin-top:0.8rem;">
                <i class="fas fa-info-circle"></i> ${q.explanation}
            </div>`;
        }
        html += `</div>`;
        questionArea.innerHTML = html;
        qIndicator.innerText = `${currentQIndex+1}/${currentQuestions.length}`;
        prevBtn.disabled = (currentQIndex === 0);
        const allDone = questionResults.every(s => s !== 'unanswered');
        const isLast = (currentQIndex === currentQuestions.length - 1);
        if (isLast && allDone) {
            nextBtn.classList.add('hidden');
            resultsBtn.classList.remove('hidden');
        } else {
            nextBtn.classList.remove('hidden');
            resultsBtn.classList.add('hidden');
        }
    }

    window.selectAnswer = function(qIdx, optIdx) {
        if (questionResults[qIdx] !== 'unanswered' || miniGameLock) return;
        const q = currentQuestions[qIdx];
        const isCorrect = (optIdx === q.correctAnswer);
        userSelections[qIdx] = optIdx;
        questionResults[qIdx] = isCorrect ? 'correct' : 'incorrect';
        if (isCorrect) totalScore += POINTS_PER;
        updateStatsUI();
        renderCurrentQuestion();
        const fb = document.createElement('div');
        fb.className = 'feedback-pop';
        if (isCorrect) fb.innerHTML = '✅ 正確！ +5 生態點數';
        else {
            const correctLetter = String.fromCharCode(65 + q.correctAnswer);
            fb.innerHTML = `❌ 錯誤！ 正確答案是 ${correctLetter}. ${q.options[q.correctAnswer]}`;
        }
        fb.style.background = isCorrect ? '#2e7d32' : '#c62828';
        questionArea.appendChild(fb);
        setTimeout(() => fb.remove(), 1700);
        if (questionResults.every(s => s !== 'unanswered')) {
            if (currentQIndex === currentQuestions.length - 1) {
                nextBtn.classList.add('hidden');
                resultsBtn.classList.remove('hidden');
            }
        }
    };

    function showFinalSummary() {
        if (miniGameLock) return;
        questionArea.classList.add('hidden');
        navDiv.classList.add('hidden');
        summaryArea.classList.remove('hidden');
        const totalCorrect = questionResults.filter(s => s === 'correct').length;
        const wrongIndices = [];
        const wrongDetails = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            if (questionResults[i] === 'incorrect') {
                wrongIndices.push(i);
                const q = currentQuestions[i];
                wrongDetails.push({
                    question: q.question,
                    userAns: q.options[userSelections[i]],
                    correctAns: q.options[q.correctAnswer]
                });
            }
        }
        let html = `<div class="summary-title">📊 生態測驗總結</div>
        <div class="overall-stats"><div class="overall-bar"><div class="bar-correct" style="width:${(totalCorrect/currentQuestions.length)*100}%;">${totalCorrect}/${currentQuestions.length}</div></div></div>`;
        if (wrongDetails.length > 0) {
            html += `<div class="wrong-questions-section"><div class="wrong-title"><i class="fas fa-exclamation-triangle"></i> ❌ 錯題回顧 (${wrongDetails.length}題)</div>`;
            wrongDetails.forEach((item, idx) => {
                html += `<div class="wrong-item"><div class="wrong-question">${idx+1}. ${item.question}</div>
                <div class="wrong-answer"><i class="fas fa-times-circle"></i> 你的答案：${item.userAns}</div>
                <div class="correct-answer"><i class="fas fa-check-circle"></i> 正確答案：${item.correctAns}</div></div>`;
            });
            html += `</div><div class="summary-buttons"><button class="summary-btn wrong-btn" id="redoWrongBtn">🔁 重做錯題</button><button class="summary-btn" id="restartSummaryBtn">🔄 重新測驗</button></div>`;
        } else {
            html += `<button class="summary-btn" id="restartSummaryBtn">🏆 完美達人 · 再測一次</button>`;
        }
        summaryArea.innerHTML = html;
        document.getElementById('restartSummaryBtn')?.addEventListener('click', () => {
            summaryArea.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });
        if (wrongDetails.length > 0) {
            document.getElementById('redoWrongBtn')?.addEventListener('click', () => {
                const wrongOriginalIndices = [];
                for (let i = 0; i < currentQuestions.length; i++) {
                    if (questionResults[i] === 'incorrect') wrongOriginalIndices.push(i);
                }
                const wrongQuestionSet = wrongOriginalIndices.map(i => currentQuestions[i]);
                startQuizWithCustomSet(wrongQuestionSet);
                summaryArea.classList.add('hidden');
            });
        }
    }

    function startQuizWithCustomSet(questionArray) {
        currentQuestions = [...questionArray];
        userSelections = new Array(currentQuestions.length).fill(null);
        questionResults = new Array(currentQuestions.length).fill('unanswered');
        totalScore = 0;
        currentQIndex = 0;
        lastMilestone = 0;
        miniGameLock = false;
        updateStatsUI();
        startScreen.classList.add('hidden');
        questionArea.classList.remove('hidden');
        navDiv.classList.remove('hidden');
        renderCurrentQuestion();
    }

    function initQuiz(mode) {
        let selected;
        if (mode === 'full') {
            selected = [...UNIT4_QUESTIONS];
        } else {
            const shuffled = [...UNIT4_QUESTIONS];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            selected = shuffled.slice(0, 15);
        }
        startQuizWithCustomSet(selected);
    }

    // 事件綁定
    document.getElementById('btnFullQuiz').addEventListener('click', () => initQuiz('full'));
    document.getElementById('btnRandom15').addEventListener('click', () => initQuiz('random'));
    document.getElementById('backHomeBtn').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });
    prevBtn.addEventListener('click', () => { if (currentQIndex > 0 && !miniGameLock) { currentQIndex--; renderCurrentQuestion(); } });
    nextBtn.addEventListener('click', () => { if (currentQIndex < currentQuestions.length - 1 && !miniGameLock) { currentQIndex++; renderCurrentQuestion(); } });
    resultsBtn.addEventListener('click', () => showFinalSummary());
    window.selectAnswer = window.selectAnswer;
})();
</script>
</body>
</html>
