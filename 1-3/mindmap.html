<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小常識 · 心智圖 · 第一冊::處變不驚 第3課</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #dbe7f3 0%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem 1rem;
        }

        .mindmap-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 40px -15px rgba(0, 40, 60, 0.4);
            padding: 1.8rem 2rem;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        /* Header */
        .mindmap-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            box-shadow: 0 6px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1.3rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 4px 0 #b38f1c;
            cursor: pointer;
            transition: 0.06s linear;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-home:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b38f1c;
        }

        .mindmap-title {
            font-size: 1.6rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.3rem 1.8rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mindmap-title i {
            color: #9b59b6;
        }

        .xp-mini {
            background: #2b3c4e;
            color: white;
            border-radius: 40px;
            padding: 0.4rem 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .xp-mini i {
            color: #ffd966;
        }

        /* Main content */
        .mindmap-content {
            background: white;
            border-radius: 40px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 0 #a0b9cf, 0 10px 25px rgba(0,0,0,0.1);
            border: 3px solid #fff6cf;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e3f5a;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 4px solid #f3b33d;
            padding-bottom: 0.8rem;
        }

        .section-title i {
            color: #f39c12;
            font-size: 2rem;
        }

        /* Mindmap Image Container */
        .mindmap-image-container {
            background: #f8fafd;
            border-radius: 30px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 3px dashed #9bb7d1;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .mindmap-image {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .mindmap-image:hover {
            transform: scale(1.02);
        }

        .image-caption {
            margin-top: 1rem;
            color: #4f6f8f;
            font-weight: 500;
            font-style: italic;
        }

        .zoom-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
        }

        /* Concept Cards */
        .concepts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .concept-card {
            background: linear-gradient(145deg, #f0f9ff, #e6f0fa);
            border-radius: 30px;
            padding: 1.5rem;
            border: 2px solid #c1d9f0;
            box-shadow: 0 6px 0 #9bb7d1;
            transition: all 0.2s;
        }

        .concept-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #9bb7d1;
        }

        .concept-icon {
            width: 50px;
            height: 50px;
            background: #58a700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: white;
            font-size: 1.5rem;
        }

        .concept-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: #1e3f5a;
            margin-bottom: 0.5rem;
        }

        .concept-desc {
            color: #4f6f8f;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Interactive Tools */
        .tools-section {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .tool-card {
            flex: 1 1 200px;
            background: #f8f4e5;
            border-radius: 30px;
            padding: 1.2rem;
            border: 2px solid #f3b33d;
            box-shadow: 0 5px 0 #d19b2a;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
        }

        .tool-card:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #d19b2a;
        }

        .tool-card i {
            font-size: 2rem;
            color: #e67e22;
            margin-bottom: 0.5rem;
        }

        .tool-card span {
            font-weight: 700;
            color: #7d5d2a;
            display: block;
        }

        /* Footer */
        .footer-note {
            text-align: center;
            margin-top: 2rem;
            color: #6b8baa;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .data-badge {
            background: #e9eef3;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        /* Modal for enlarged image */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: #f3b33d;
            transform: scale(1.2);
        }

        /* Loading state */
        .loading-spinner {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="mindmap-container">
    <!-- Header -->
    <div class="mindmap-header">
        <button class="back-home" id="backToIndexBtn"><i class="fas fa-arrow-left"></i> 返回</button>
        <span class="mindmap-title">
            <i class="fas fa-brain"></i> 心智圖 · 第3課
        </span>
        <div class="xp-mini">
            <i class="fas fa-star"></i> 1,280 XP
        </div>
    </div>

    <!-- Main Content -->
    <div class="mindmap-content">
        <div class="section-title">
            <i class="fas fa-sitemap"></i> 
            兩性關係概念圖：友情、愛情與性
        </div>

        <!-- Mindmap Image Container -->
        <div class="mindmap-image-container" id="mindmapContainer">
            <!-- Using a placeholder SVG mindmap - in real app, replace with actual image -->
            <svg class="mindmap-image" viewBox="0 0 800 400" style="background: #f0f7ff; border-radius: 20px;">
                <!-- Central node -->
                <circle cx="400" cy="150" r="50" fill="#58a700" stroke="#2e7d32" stroke-width="3"/>
                <text x="400" y="155" text-anchor="middle" fill="white" font-weight="bold" font-size="14">兩性關係</text>
                
                <!-- Branch 1: 友情 -->
                <line x1="360" y1="135" x2="200" y2="80" stroke="#3498db" stroke-width="2"/>
                <circle cx="180" cy="70" r="30" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
                <text x="180" y="75" text-anchor="middle" fill="white" font-weight="bold" font-size="12">友情</text>
                <text x="180" y="110" text-anchor="middle" fill="#2c3e50" font-size="10">信任·尊重</text>
                
                <!-- Branch 2: 愛情 -->
                <line x1="440" y1="135" x2="600" y2="80" stroke="#e74c3c" stroke-width="2"/>
                <circle cx="620" cy="70" r="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                <text x="620" y="75" text-anchor="middle" fill="white" font-weight="bold" font-size="12">愛情</text>
                <text x="620" y="110" text-anchor="middle" fill="#2c3e50" font-size="10">溝通·承諾</text>
                
                <!-- Branch 3: 性 -->
                <line x1="400" y1="190" x2="400" y2="270" stroke="#9b59b6" stroke-width="2"/>
                <circle cx="400" cy="300" r="30" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
                <text x="400" y="305" text-anchor="middle" fill="white" font-weight="bold" font-size="12">性</text>
                <text x="400" y="340" text-anchor="middle" fill="#2c3e50" font-size="10">自願·成熟</text>
                
                <!-- Sub-branches -->
                <line x1="150" y1="70" x2="100" y2="150" stroke="#3498db" stroke-width="1.5" stroke-dash="5,5"/>
                <text x="80" y="170" fill="#34495e" font-size="9">共同興趣</text>
                
                <line x1="650" y1="70" x2="700" y2="150" stroke="#e74c3c" stroke-width="1.5" stroke-dash="5,5"/>
                <text x="720" y="170" fill="#34495e" font-size="9">互相扶持</text>
                
                <line x1="400" y1="330" x2="350" y2="370" stroke="#9b59b6" stroke-width="1.5" stroke-dash="5,5"/>
                <text x="310" y="390" fill="#34495e" font-size="9">法律責任</text>
                
                <!-- Title -->
                <text x="400" y="30" text-anchor="middle" fill="#1e3f5a" font-weight="bold" font-size="16">健康的兩性關係心智圖</text>
            </svg>
            
            <div class="image-caption">
                <i class="fas fa-lightbulb"></i> 點擊圖片可放大檢視 · 兩性關係核心概念
            </div>
            <div class="zoom-hint">
                <i class="fas fa-search-plus"></i> 點擊放大
            </div>
        </div>

        <!-- Concept Cards -->
        <div class="concepts-grid">
            <div class="concept-card">
                <div class="concept-icon" style="background: #3498db;">
                    <i class="fas fa-handshake"></i>
                </div>
                <div class="concept-title">健康友情</div>
                <div class="concept-desc">互相尊重、信任、支持，保持適當界限</div>
            </div>
            
            <div class="concept-card">
                <div class="concept-icon" style="background: #e74c3c;">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="concept-title">成熟愛情</div>
                <div class="concept-desc">平等溝通、共同成長、負責任的承諾</div>
            </div>
            
            <div class="concept-card">
                <div class="concept-icon" style="background: #9b59b6;">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="concept-title">負責任的性</div>
                <div class="concept-desc">自願、成熟、知情同意、安全防護</div>
            </div>
            
            <div class="concept-card">
                <div class="concept-icon" style="background: #f39c12;">
                    <i class="fas fa-gavel"></i>
                </div>
                <div class="concept-title">法律保護</div>
                <div class="concept-desc">未成年保護、性侵犯定義、法律責任</div>
            </div>
        </div>

        <!-- Interactive Tools -->
        <div class="tools-section">
            <div class="tool-card" id="expandMindmap">
                <i class="fas fa-expand-alt"></i>
                <span>展開全圖</span>
            </div>
            <div class="tool-card" id="downloadMindmap">
                <i class="fas fa-download"></i>
                <span>下載圖片</span>
            </div>
            <div class="tool-card" id="shareMindmap">
                <i class="fas fa-share-alt"></i>
                <span>分享心智圖</span>
            </div>
            <div class="tool-card" id="printMindmap">
                <i class="fas fa-print"></i>
                <span>列印</span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
        <span class="data-badge">
            <i class="fas fa-database"></i> 心智圖來源: 兩性關係教材
        </span>
        <span class="data-badge">
            <i class="fas fa-tag"></i> 第一冊·第3課
        </span>
    </div>
</div>

<!-- Modal for enlarged image -->
<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImage" src="" alt="放大的心智圖">
</div>

<script>
    (function() {
        // Back to index
        document.getElementById('backToIndexBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Modal functionality for image zoom
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const mindmapContainer = document.getElementById('mindmapContainer');
        
        // When clicking on the mindmap container, show modal with SVG converted to image
        mindmapContainer.addEventListener('click', function() {
            // Get the SVG element
            const svg = document.querySelector('.mindmap-image');
            
            // Convert SVG to data URL (in real app, you'd have a PNG)
            // For demo, we'll use a placeholder
            modal.style.display = 'block';
            
            // Create a canvas from SVG (simplified for demo)
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            
            // For demo, we'll just show a message
            modalImg.src = 'data:image/svg+xml,' + encodeURIComponent(svgData);
        });

        // Close modal when clicking X
        document.querySelector('.close-modal').addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Tool card interactions
        document.getElementById('expandMindmap').addEventListener('click', function() {
            mindmapContainer.click(); // Trigger the same as clicking the image
        });

        document.getElementById('downloadMindmap').addEventListener('click', function() {
            alert('📥 心智圖下載功能\n\n在實際應用中，這裡會下載心智圖圖片檔案。');
        });

        document.getElementById('shareMindmap').addEventListener('click', function() {
            alert('📤 分享心智圖\n\n在實際應用中，這裡會開啟分享選項。');
        });

        document.getElementById('printMindmap').addEventListener('click', function() {
            alert('🖨️ 列印心智圖\n\n在實際應用中，這裡會開啟列印對話框。');
        });

        // Add loading state simulation
        window.addEventListener('load', function() {
            console.log('Mindmap page loaded successfully');
        });
    })();
</script>
</body>
</html>
