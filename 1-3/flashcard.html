<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 費曼閃卡 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            font-size: 18px;
        }

        .flashcard-container {
            max-width: 100%;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.5rem 0.3rem;
        }

        .flashcard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-home:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b38f1c;
        }

        .flashcard-title {
            font-size: 1.4rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .flashcard-title i {
            color: #3498db;
            font-size: 1.2rem;
        }

        .progress-stats {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #2b3c4e;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
        }
        .progress-stats i {
            color: #ffd966;
        }

        .flashcard-wrapper {
            background: #f5faff;
            border-radius: 25px;
            padding: 1rem 0.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 6px 0 #9bb7d1, 0 8px 20px rgba(0,40,60,0.1);
            border: 2px solid #c1d9f0;
        }

        .deck-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 3px solid #9bb7d1;
            flex-wrap: wrap;
        }
        .deck-icon {
            width: 50px;
            height: 50px;
            background: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 3px 0 #1f5b8a;
            flex-shrink: 0;
        }
        .deck-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a4972;
            line-height: 1.3;
            flex: 1;
        }

        .progress-section {
            margin-bottom: 0.8rem;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #2c5a7a;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .progress-bar-bg {
            height: 12px;
            background: #e2eaf3;
            border-radius: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58cc71, #2e9b5c);
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s;
        }

        .card-scene {
            perspective: 1800px;
            margin: 1rem 0 1.5rem;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            min-height: 320px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 22px;
            box-shadow: 0 8px 0 #a0b9cf, 0 10px 25px rgba(0,0,0,0.15);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            min-height: 320px;
            backface-visibility: hidden;
            border-radius: 22px;
            padding: 1.8rem 1.5rem;
            background: white;
            border-left: 8px solid #3498db;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .card-front {
            background: linear-gradient(145deg, #ffffff, #f5faff);
        }

        .card-back {
            background: #eef5ff;
            transform: rotateY(180deg);
            border-left-color: #f3b33d;
        }

        .question-tag {
            display: inline-block;
            background: #f4d03f;
            color: #1f3a4b;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            align-self: flex-start;
        }

        .card-front .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e3f5a;
            line-height: 1.4;
            margin-bottom: 1.2rem;
        }

        .card-front .options-list {
            list-style: none;
            margin-top: 0.5rem;
        }
        .card-front .options-list li {
            padding: 0.4rem 0 0.4rem 1.8rem;
            position: relative;
            font-size: 1.1rem;
        }
        .card-front .options-list li:before {
            content: "•";
            color: #3498db;
            font-weight: bold;
            font-size: 1.6rem;
            position: absolute;
            left: 0;
            top: -2px;
        }

        .card-back .answer-text {
            font-size: 1.2rem;
            color: #1f3a4b;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .card-back .explanation-box {
            background: #fff9e6;
            border-left: 6px solid #f3b33d;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
            font-size: 1.1rem;
            color: #7d5d2a;
        }
        .card-back .hint-badge {
            background: #e1f0fa;
            border-radius: 30px;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            color: #1a4972;
            border: 1px dashed #9bb7d1;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .flip-hint {
            text-align: center;
            margin: 0.5rem 0 1rem;
            color: #4f6f8f;
            font-size: 1rem;
            font-style: italic;
        }

        .navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .nav-btn {
            background: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #1f4973;
            box-shadow: 0 3px 0 #9fbad0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.06s linear;
        }
        .nav-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9fbad0;
        }
        .nav-btn.primary {
            background: #58a700;
            color: white;
            box-shadow: 0 3px 0 #3e7a00;
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 3px 0 #9fbad0;
        }

        .card-counter {
            background: #e1edff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1a4972;
            font-size: 1rem;
        }

        .method-badge {
            background: #e1f0fa;
            border-radius: 16px;
            padding: 0.8rem;
            margin: 1rem 0 0;
            text-align: center;
            border: 1px dashed #9bb7d1;
            color: #1a4972;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
        }
        .method-badge i {
            color: #f3b33d;
            font-size: 1.3rem;
        }

        .footer-note {
            text-align: center;
            margin-top: 1rem;
            color: #6b8baa;
            font-weight: 600;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .flashcard-header { flex-direction: column; align-items: stretch; }
            .card-front .question-text { font-size: 1.2rem; }
            .card-back .answer-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="flashcard-container">
    <div class="flashcard-header">
        <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="flashcard-title" id="page-title">
            <i class="fas fa-layer-group"></i> 費曼閃卡
        </span>
        <div class="progress-stats" id="lesson-subtitle">
            <i class="fas fa-book-open"></i> 載入中...
        </div>
    </div>

    <div class="flashcard-wrapper">
        <div class="deck-header">
            <div class="deck-icon" id="deck-icon"><i class="fas fa-heart"></i></div>
            <div class="deck-title" id="deck-title">💡 綜合題庫 · 閃卡</div>
        </div>

        <div class="progress-section">
            <div class="progress-info">
                <span>📚 學習進度 <span id="current-card-num">1</span>/<span id="total-cards">0</span></span>
                <span id="completion-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <div class="card-scene" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-front">
                    <span class="question-tag"><i class="fas fa-question-circle"></i> 問題</span>
                    <div class="question-text" id="question-text">載入中...</div>
                    <div id="options-container" class="options-list"></div>
                </div>
                <div class="card-back">
                    <span class="question-tag"><i class="fas fa-lightbulb"></i> 費曼解答</span>
                    <div class="answer-text" id="answer-text"></div>
                    <div id="explanation-container"></div>
                    <div id="hint-container" class="hint-badge"></div>
                </div>
            </div>
        </div>
        <div class="flip-hint">
            <i class="fas fa-hand-pointer"></i> 點擊卡片翻轉看答案
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled><i class="fas fa-chevron-left"></i> 上一張</button>
            <span class="card-counter" id="card-counter">0/0</span>
            <button class="nav-btn primary" id="next-btn" onclick="nextCard()" disabled>下一張 <i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="method-badge">
            <i class="fas fa-chalkboard-teacher"></i> 費曼學習法：用自己的話簡單解釋，才是真正理解
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-check-circle" style="color:#2ecc71;"></i> 點擊卡片 · 主動回憶
    </div>
</div>

<script>
    // 可自訂的 JSON 檔案路徑
    const JSON_FILE = 'flashcards-data.json';
    
    let flashcards = [];
    let currentIndex = 0;

    async function loadFlashcards() {
        try {
            console.log(`嘗試載入: ${JSON_FILE}`);
            const response = await fetch(JSON_FILE);
            
            if (!response.ok) {
                throw new Error(`無法載入 ${JSON_FILE} (HTTP ${response.status})`);
            }
            
            const data = await response.json();
            console.log('載入成功，卡片數量:', data.cards?.length);
            
            flashcards = data.cards || [];
            
            // 更新頁面標題
            document.getElementById('page-title').innerHTML = `<i class="fas fa-layer-group"></i> ${data.lessonTitle || '費曼閃卡'}`;
            document.getElementById('deck-title').textContent = `💡 ${data.lessonTitle || '綜合題庫'}`;
            document.getElementById('lesson-subtitle').innerHTML = `<i class="fas fa-book-open"></i> ${data.lessonTitle || '兩性關係與急救'}`;
            
            if (data.lessonIcon) {
                document.getElementById('deck-icon').innerHTML = `<i class="fas ${data.lessonIcon}"></i>`;
            }
            
            document.getElementById('total-cards').textContent = flashcards.length;
            
            if (flashcards.length > 0) {
                updateCard();
                document.getElementById('next-btn').disabled = false;
            } else {
                throw new Error('卡片陣列為空');
            }
            
        } catch (error) {
            console.error('載入失敗:', error);
            document.getElementById('question-text').innerHTML = `⚠️ 載入失敗<br><small>${error.message}</small>`;
            document.getElementById('options-container').innerHTML = '';
        }
    }

    function updateCard() {
        if (flashcards.length === 0) return;
        
        const card = flashcards[currentIndex];
        
        // 更新問題與選項
        document.getElementById('question-text').textContent = card.question;
        
        // 顯示選項（如果是選擇題）
        if (card.options && Array.isArray(card.options)) {
            let optionsHtml = '<ul class="options-list">';
            card.options.forEach(opt => {
                optionsHtml += `<li>${opt}</li>`;
            });
            optionsHtml += '</ul>';
            document.getElementById('options-container').innerHTML = optionsHtml;
        } else {
            document.getElementById('options-container').innerHTML = '';
        }
        
        // 更新答案與解說
        let answerText = '';
        if (card.type === 'mc' && card.correctAnswer !== undefined) {
            const correctIndex = card.correctAnswer;
            const correctLetter = String.fromCharCode(65 + correctIndex);
            answerText = `正確答案：${correctLetter}`;
        } else {
            answerText = card.answer || '請參閱解說';
        }
        document.getElementById('answer-text').textContent = answerText;
        
        // 解說區
        const explanationHtml = card.explanation 
            ? `<div class="explanation-box"><i class="fas fa-info-circle"></i> ${card.explanation}</div>`
            : '';
        document.getElementById('explanation-container').innerHTML = explanationHtml;
        
        // 提示區
        const hintHtml = card.hint 
            ? `<i class="fas fa-lightbulb"></i> 提示：${card.hint}`
            : '';
        document.getElementById('hint-container').innerHTML = hintHtml;
        
        // 更新計數與進度
        document.getElementById('current-card-num').textContent = currentIndex + 1;
        document.getElementById('card-counter').textContent = `${currentIndex + 1}/${flashcards.length}`;
        
        const percent = Math.round(((currentIndex + 1) / flashcards.length) * 100);
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('completion-percent').textContent = percent + '%';
        
        // 確保卡片恢復正面
        document.getElementById('flashcard').classList.remove('flipped');
        
        // 更新按鈕狀態
        document.getElementById('prev-btn').disabled = (currentIndex === 0);
        document.getElementById('next-btn').disabled = (currentIndex === flashcards.length - 1);
    }

    window.flipCard = function() {
        document.getElementById('flashcard').classList.toggle('flipped');
    };

    window.prevCard = function() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    };

    window.nextCard = function() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            updateCard();
        }
    };

    window.onload = loadFlashcards;
</script>
</body>
</html>
