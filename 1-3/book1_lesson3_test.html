<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 測驗 · 第一冊::處變不驚 第3課</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;        /* 垂直置中讓卡片更集中 */
            padding: 0.5rem;
            font-size: 17px;
        }

        .test-container {
            max-width: 500px;           /* 手機寬度，讓內容更緊湊 */
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 30px -10px rgba(0,40,60,0.4);
            padding: 1rem 0.8rem;
            border: 2px solid rgba(255,255,255,0.8);
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        /* 固定 header 和 footer，中間內容可捲動（但我們盡量讓它不捲） */
        .test-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 0.8rem;
            box-shadow: 0 3px 0 #bed0e3;
            flex-shrink: 0;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.3rem 0.9rem;
            font-weight: 700;
            font-size: 1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }
        .back-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #b38f1c; }

        .test-title {
            font-size: 1.2rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
        }

        .test-stats {
            display: flex;
            gap: 0.5rem;
            background: #2b3c4e;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .progress-section {
            margin-bottom: 0.6rem;
            flex-shrink: 0;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.2rem;
            font-weight: 600;
            color: #2c5a7a;
            font-size: 0.9rem;
        }
        .progress-bar-bg {
            height: 10px;
            background: #e2eaf3;
            border-radius: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58cc71, #2e9b5c);
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s;
        }

        /* 問題卡片 — 壓縮內距，讓內容盡量一次顯示 */
        .question-card {
            background: white;
            border-radius: 24px;
            padding: 1rem 0.8rem;
            margin-bottom: 0.8rem;
            box-shadow: 0 5px 0 #a0b9cf, 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #fff6cf;
            flex: 1 1 auto;
            overflow-y: auto;
            max-height: 50vh;           /* 限制高度，必要時可捲動 */
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .question-number {
            background: #3498db;
            color: white;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .subtopic-badge {
            background: #f4d03f;
            color: #1f3a4b;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e3f5a;
            margin-bottom: 1rem;
            line-height: 1.3;
            padding-left: 0.3rem;
            border-left: 4px solid #f3b33d;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .option-btn {
            background: #f5f9ff;
            border: 2px solid #cad9eb;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #1f4973;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 3px 0 #9fbad0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
            transition: all 0.1s;
        }
        .option-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #9fbad0; }
        .option-btn.selected { background: #c1e5c0; border-color: #58a700; box-shadow: 0 3px 0 #3e7a00; }
        .option-btn.correct { background: #a5d6a5; border-color: #2e7d32; box-shadow: 0 3px 0 #1b5e20; }
        .option-btn.incorrect { background: #ffcdd2; border-color: #c62828; box-shadow: 0 3px 0 #8b0000; }
        .option-btn:disabled { opacity: 0.8; cursor: default; }
        .option-prefix {
            background: #2b5f8a;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .explanation-box {
            background: #fff9e6;
            border-left: 6px solid #f3b33d;
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: #7d5d2a;
            display: none;
        }
        .explanation-box.show { display: block; }

        /* 導航列：上一題 & 下一題 同一行 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-shrink: 0;
        }
        .nav-btn {
            background: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #1f4973;
            box-shadow: 0 3px 0 #9fbad0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;                   /* 讓兩個按鈕平分寬度 */
            justify-content: center;
        }
        .nav-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #9fbad0; }
        .nav-btn.primary { background: #58a700; color: white; box-shadow: 0 3px 0 #3e7a00; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .question-indicator {
            background: #e1edff;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1a4972;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        /* 結果畫面 */
        .results-screen {
            text-align: center;
            padding: 1rem;
        }
        .results-icon { font-size: 3rem; color: #f3b33d; margin-bottom: 0.5rem; }
        .results-score { font-size: 2rem; font-weight: 900; color: #1e3f5a; margin-bottom: 0.3rem; }
        .results-message { font-size: 1rem; color: #4f6f8f; margin-bottom: 1.5rem; }
        .restart-btn {
            background: #48b5a5;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 0 #1c6b5e;
            cursor: pointer;
        }

        /* 模態框 (XP bonus & streak) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-card {
            background: white;
            border-radius: 40px;
            padding: 1.8rem 1.5rem;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
            border: 4px solid #f3b33d;
        }
        .modal-icon { font-size: 3rem; color: #f39c12; margin-bottom: 0.5rem; }
        .modal-title { font-size: 1.6rem; font-weight: 900; color: #1f3a4b; margin-bottom: 0.3rem; }
        .modal-message { font-size: 1.1rem; color: #4f6f8f; margin-bottom: 1.2rem; }
        .streak-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin: 1rem 0;
            font-size: 0.8rem;
        }
        .streak-day {
            background: #ecf0f1;
            border-radius: 8px;
            padding: 0.3rem 0;
            text-align: center;
            font-weight: 600;
        }
        .streak-day.active {
            background: #f39c12;
            color: white;
        }
        .modal-btn {
            background: #58a700;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            box-shadow: 0 4px 0 #3e7a00;
            cursor: pointer;
            margin-top: 0.8rem;
            width: 100%;
        }
        .hidden { display: none; }
        .footer-note {
            text-align: center;
            margin-top: 0.5rem;
            color: #6b8baa;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="test-container">
    <!-- 返回按鈕 & 標頭 -->
    <div class="test-header">
        <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="test-title">第3課 · 測驗</span>
        <div class="test-stats">
            <span><i class="fas fa-star"></i> <span id="earnedPoints">0</span>/<span id="totalPoints">0</span></span>
        </div>
    </div>

    <!-- 進度條 -->
    <div class="progress-section">
        <div class="progress-info">
            <span>第 <span id="currentQNum">1</span>/<span id="totalQNum">0</span> 題</span>
            <span id="completionPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
    </div>

    <!-- 題目區 (動態載入) -->
    <div id="questionsArea" class="question-card" style="display: none;"></div>

    <!-- 導航列：上一題 & 下一題 同一行 -->
    <div class="nav-buttons" id="navButtons" style="display: none;">
        <button class="nav-btn" id="prevBtn" disabled><i class="fas fa-chevron-left"></i> 上一題</button>
        <span class="question-indicator" id="questionIndicator">1/0</span>
        <button class="nav-btn primary" id="nextBtn">下一題 <i class="fas fa-chevron-right"></i></button>
        <button class="nav-btn primary hidden" id="submitBtn">提交</button>
        <button class="nav-btn primary hidden" id="showResultsBtn">結果</button>
    </div>

    <!-- 結果畫面 (初始隱藏) -->
    <div id="resultsScreen" class="results-screen hidden">
        <div class="results-icon"><i class="fas fa-trophy"></i></div>
        <div class="results-score" id="finalScore">0/0</div>
        <div class="results-message" id="finalMessage"></div>
        <button class="restart-btn" id="restartTest"><i class="fas fa-redo-alt"></i> 重新測驗</button>
    </div>

    <!-- 載入中／錯誤訊息 -->
    <div id="loadingArea" class="loading-spinner" style="text-align:center; padding:2rem;">
        <div class="spinner" style="border:5px solid #f3f3f3; border-top:5px solid #3498db; border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite; margin:0 auto;"></div>
        <p>載入題目中...</p>
    </div>

    <div class="footer-note">
        <i class="fas fa-database"></i> source_data_test.json
    </div>
</div>

<!-- 模態框：XP Bonus -->
<div id="xpModal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-icon"><i class="fas fa-bolt"></i></div>
        <div class="modal-title">Good job!</div>
        <div class="modal-message">Earn extra XP for the next 10 minutes.</div>
        <button class="modal-btn" id="xpContinue">CONTINUE</button>
    </div>
</div>

<!-- 模態框：Streak -->
<div id="streakModal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-icon"><i class="fas fa-fire"></i></div>
        <div class="modal-title">281 day streak</div>
        <div class="streak-calendar">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            <!-- 簡易日曆佔位，實際可動態產生 -->
            <span>20</span><span>21</span><span>22</span><span class="active">23</span><span>24</span><span>25</span><span>26</span>
            <span>27</span><span>28</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>
        <div class="modal-message">You extended your streak with over 16 hours left in the day. Nice work!</div>
        <button class="modal-btn" id="streakContinue">CONTINUE</button>
    </div>
</div>

<style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .active { background: #f39c12; color: white; border-radius: 8px; }
</style>

<script>
(function() {
    // ---------- 狀態 ----------
    let testData = null;
    let currentIndex = 0;
    let userAnswers = [];
    let questionStatus = []; // 'unanswered', 'correct', 'incorrect'
    let earnedPoints = 0;
    const pointsPerQuestion = 5;

    // DOM 元素
    const loadingArea = document.getElementById('loadingArea');
    const questionsArea = document.getElementById('questionsArea');
    const navButtons = document.getElementById('navButtons');
    const resultsScreen = document.getElementById('resultsScreen');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const showResultsBtn = document.getElementById('showResultsBtn');
    const questionIndicator = document.getElementById('questionIndicator');
    const currentQNum = document.getElementById('currentQNum');
    const totalQNum = document.getElementById('totalQNum');
    const progressFill = document.getElementById('progressFill');
    const completionPercent = document.getElementById('completionPercent');
    const earnedPointsSpan = document.getElementById('earnedPoints');
    const totalPointsSpan = document.getElementById('totalPoints');
    const finalScore = document.getElementById('finalScore');
    const finalMessage = document.getElementById('finalMessage');
    const restartBtn = document.getElementById('restartTest');

    // 模態框
    const xpModal = document.getElementById('xpModal');
    const streakModal = document.getElementById('streakModal');
    const xpContinue = document.getElementById('xpContinue');
    const streakContinue = document.getElementById('streakContinue');

    // ---------- 載入 JSON ----------
    function loadTestData() {
        fetch('source_data_test.json')
            .then(r => { if (!r.ok) throw new Error('無法載入題目'); return r.json(); })
            .then(data => {
                testData = data;
                // 確保每題都有 type (強制為 multiple-choice)
                testData.questions = testData.questions.map(q => ({ type: 'multiple-choice', ...q }));
                // 初始化陣列
                testData.questions.forEach((_, i) => { userAnswers[i] = null; questionStatus[i] = 'unanswered'; });

                // 更新介面
                totalPointsSpan.textContent = testData.totalPoints || (testData.questions.length * pointsPerQuestion);
                totalQNum.textContent = testData.questions.length;
                questionIndicator.textContent = `1/${testData.questions.length}`;
                currentQNum.textContent = '1';

                loadingArea.style.display = 'none';
                questionsArea.style.display = 'block';
                navButtons.style.display = 'flex';
                loadQuestion(0);
            })
            .catch(err => {
                loadingArea.innerHTML = `<div style="color:#c62828;">❌ ${err.message}<br><button onclick="location.reload()">重試</button></div>`;
            });
    }

    // 顯示題目
    function loadQuestion(index) {
        if (!testData) return;
        const q = testData.questions[index];
        currentIndex = index;

        const letters = ['A', 'B', 'C', 'D'];
        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
            let cls = '';
            if (questionStatus[index] !== 'unanswered') {
                if (optIdx === q.correctAnswer) cls = 'correct';
                else if (optIdx === userAnswers[index]) cls = 'incorrect';
            } else if (userAnswers[index] === optIdx) cls = 'selected';

            optionsHtml += `
                <button class="option-btn ${cls}" onclick="selectAnswer(${index}, ${optIdx})" ${questionStatus[index] !== 'unanswered' ? 'disabled' : ''}>
                    <span class="option-prefix">${letters[optIdx]}</span> ${opt}
                </button>
            `;
        });

        let html = `
            <div class="question-header">
                <span class="question-number">第 ${index+1} 題</span>
                <span class="subtopic-badge"><i class="fas fa-tag"></i> ${q.subtopic || '一般'}</span>
            </div>
            <div class="question-text">${q.question}</div>
            <div class="options-grid">${optionsHtml}</div>
        `;
        if (questionStatus[index] !== 'unanswered') {
            html += `<div class="explanation-box show"><i class="fas fa-info-circle"></i> ${q.explanation || ''}</div>`;
        } else {
            html += `<div class="explanation-box"></div>`;
        }

        questionsArea.innerHTML = html;
        currentQNum.textContent = index + 1;
        questionIndicator.textContent = `${index+1}/${testData.questions.length}`;
        updateNav();
        updateProgress();
    }

    // 全域選擇答案
    window.selectAnswer = function(qIdx, optIdx) {
        if (questionStatus[qIdx] !== 'unanswered') return;
        const q = testData.questions[qIdx];
        userAnswers[qIdx] = optIdx;
        const correct = (optIdx === q.correctAnswer);
        questionStatus[qIdx] = correct ? 'correct' : 'incorrect';

        // 更新分數
        let points = 0;
        questionStatus.forEach(s => { if (s === 'correct') points += pointsPerQuestion; });
        earnedPoints = points;
        earnedPointsSpan.textContent = earnedPoints;

        // 重新顯示題目 (會有正確/錯誤樣式)
        loadQuestion(qIdx);

        // 如果答對，顯示 XP 模態框
        if (correct) {
            xpModal.classList.remove('hidden');
        }
    };

    // 關閉 XP 模態
    xpContinue.addEventListener('click', () => {
        xpModal.classList.add('hidden');
        // 可自動跳到下一題？ 為了配合原圖 CONTINUE 後應該繼續，但不強制跳題
    });

    // 關閉 Streak 模態
    streakContinue.addEventListener('click', () => {
        streakModal.classList.add('hidden');
    });

    // 更新導航按鈕
    function updateNav() {
        prevBtn.disabled = (currentIndex === 0);
        const last = (currentIndex === testData.questions.length - 1);
        const allAnswered = questionStatus.every(s => s !== 'unanswered');

        if (last) {
            if (allAnswered) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.add('hidden');
                showResultsBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
                showResultsBtn.classList.add('hidden');
            }
        } else {
            nextBtn.classList.remove('hidden');
            submitBtn.classList.add('hidden');
            showResultsBtn.classList.add('hidden');
        }
    }

    // 更新進度條
    function updateProgress() {
        const total = testData.questions.length;
        const answered = questionStatus.filter(s => s !== 'unanswered').length;
        const percent = Math.round((answered / total) * 100);
        progressFill.style.width = percent + '%';
        completionPercent.textContent = percent + '%';
    }

    // 顯示結果
    function showResults() {
        questionsArea.style.display = 'none';
        navButtons.style.display = 'none';
        resultsScreen.classList.remove('hidden');

        const totalPossible = testData.questions.length * pointsPerQuestion;
        finalScore.textContent = `${earnedPoints}/${totalPossible}`;
        const p = Math.round((earnedPoints / totalPossible) * 100);
        if (p >= 90) finalMessage.textContent = '🎉 太棒了！你是安全小專家！';
        else if (p >= 70) finalMessage.textContent = '👍 不錯喔！再複習一下會更熟練！';
        else if (p >= 50) finalMessage.textContent = '📚 加油！多練習幾次就能掌握！';
        else finalMessage.textContent = '💪 別氣餒！再試一次會更好！';

        // 顯示 streak 模態框 (模擬獎勵)
        streakModal.classList.remove('hidden');
    }

    // 重新測驗
    function restart() {
        testData.questions.forEach((_, i) => { userAnswers[i] = null; questionStatus[i] = 'unanswered'; });
        earnedPoints = 0;
        earnedPointsSpan.textContent = '0';
        currentIndex = 0;
        resultsScreen.classList.add('hidden');
        questionsArea.style.display = 'block';
        navButtons.style.display = 'flex';
        loadQuestion(0);
    }

    // 事件綁定
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) loadQuestion(currentIndex - 1); });
    nextBtn.addEventListener('click', () => { if (currentIndex < testData.questions.length - 1) loadQuestion(currentIndex + 1); });
    submitBtn.addEventListener('click', () => {
        if (questionStatus[currentIndex] === 'unanswered') { alert('請先回答'); return; }
        if (currentIndex < testData.questions.length - 1) loadQuestion(currentIndex + 1);
    });
    showResultsBtn.addEventListener('click', showResults);
    restartBtn.addEventListener('click', restart);

    // 啟動
    loadTestData();
})();
</script>
</body>
</html>
