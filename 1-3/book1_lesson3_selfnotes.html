<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小常識 · 個人筆記 · 第一冊::處變不驚 第3課</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem 1rem;
        }

        .notes-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 40px -15px rgba(26, 55, 80, 0.4);
            padding: 1.8rem 2rem;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        /* Header */
        .notes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            box-shadow: 0 6px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1.3rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 4px 0 #b38f1c;
            cursor: pointer;
            transition: 0.06s linear;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-home:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b38f1c;
        }

        .notes-title {
            font-size: 1.6rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.3rem 1.8rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notes-title i {
            color: #3498db;
        }

        .xp-mini {
            background: #2b3c4e;
            color: white;
            border-radius: 40px;
            padding: 0.4rem 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .xp-mini i {
            color: #ffd966;
        }

        /* Main content - Notebook style with blue theme */
        .notebook {
            background: #f5faff;
            border-radius: 40px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 0 #9bb7d1, 0 10px 25px rgba(0,40,60,0.15);
            border: 3px solid #c1d9f0;
            position: relative;
            background-image: linear-gradient(#e1edff 1px, transparent 1px);
            background-size: 100% 2rem;
            min-height: 500px;
        }

        .notebook-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px dashed #9bb7d1;
        }

        .notebook-icon {
            width: 60px;
            height: 60px;
            background: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 4px 0 #1f5b8a;
        }

        .notebook-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a4972;
        }

        .notebook-date {
            margin-left: auto;
            color: #6b8baa;
            font-weight: 600;
            background: #e1edff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
        }

        /* Notes area */
        .notes-area {
            padding: 1rem 0;
        }

        .topic-section {
            margin-bottom: 2rem;
        }

        .topic-label {
            font-weight: 800;
            color: #2980b9;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topic-label i {
            color: #3498db;
        }

        .notes-textarea {
            width: 100%;
            min-height: 100px;
            padding: 1.2rem;
            border: 2px solid #c1d9f0;
            border-radius: 30px;
            font-size: 1rem;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.9);
            resize: vertical;
            font-family: 'Courier New', monospace;
            margin-bottom: 1rem;
            transition: all 0.2s;
            color: #1f3a4b;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.2);
            background: white;
        }

        /* Sticky notes - blue theme */
        .sticky-notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .sticky-note {
            background: #e1f0fa;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 0 #7fa3c2, 5px 5px 15px rgba(0,0,0,0.1);
            transform: rotate(0deg);
            transition: all 0.2s;
            border: 2px solid #9bb7d1;
        }

        .sticky-note:hover {
            transform: rotate(1deg) scale(1.02);
            box-shadow: 0 10px 0 #6b8baa;
        }

        .sticky-note:nth-child(odd) {
            background: #d4e6f5;
        }

        .sticky-note i {
            color: #3498db;
            margin-bottom: 0.8rem;
            font-size: 1.5rem;
        }

        .sticky-note h4 {
            color: #1a4972;
            margin-bottom: 0.5rem;
        }

        .sticky-note p {
            color: #2c5a7a;
            font-size: 0.9rem;
        }

        /* Action buttons - blue theme */
        .notes-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 2rem 0;
        }

        .action-btn {
            background: #3498db;
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 5px 0 #1f5b8a;
            cursor: pointer;
            transition: 0.06s linear;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 auto;
            justify-content: center;
        }

        .action-btn.secondary {
            background: #7f8c8d;
            box-shadow: 0 5px 0 #5a6263;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1f5b8a;
        }

        .action-btn.secondary:active {
            box-shadow: 0 1px 0 #5a6263;
        }

        /* Footer */
        .footer-note {
            text-align: center;
            margin-top: 2rem;
            color: #6b8baa;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .save-status {
            background: #d4e6f5;
            color: #1a4972;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #9bb7d1;
        }

        /* Modal for image notes */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,40,60,0.9);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 80%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 40px;
            text-align: center;
            border: 4px solid #3498db;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 25px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: #f3b33d;
            transform: scale(1.2);
        }

        /* Progress indicator */
        .notes-progress {
            height: 6px;
            background: #e1edff;
            border-radius: 10px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .notes-progress-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s;
        }

        /* Word count badge */
        .word-count {
            font-size: 0.8rem;
            color: #6b8baa;
            text-align: right;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
<div class="notes-container">
    <!-- Header -->
    <div class="notes-header">
        <button class="back-home" id="backToIndexBtn"><i class="fas fa-arrow-left"></i> 返回</button>
        <span class="notes-title">
            <i class="fas fa-pen-fancy"></i> 個人筆記 · 第3課
        </span>
        <div class="xp-mini">
            <i class="fas fa-star"></i> 1,280 XP
        </div>
    </div>

    <!-- Main Notebook -->
    <div class="notebook">
        <div class="notebook-header">
            <div class="notebook-icon">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="notebook-title">兩性關係學習筆記</div>
            <div class="notebook-date">
                <i class="far fa-calendar-alt"></i> <span id="currentDate">2026-03-03</span>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="notes-progress">
            <div class="notes-progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <div class="notes-area">
            <!-- Topic 1: 友情 -->
            <div class="topic-section">
                <div class="topic-label">
                    <i class="fas fa-handshake"></i> 友情篇 · 互相尊重與信任
                </div>
                <textarea class="notes-textarea" id="note1" placeholder="寫下你對健康友情的觀察和心得...
- 互相尊重的界限
- 信任的建立
- 男女之間純友誼的可能性">- 男女之間可以有純友誼，關鍵是雙方都要尊重彼此的感受和界限
- 健康的友情包含信任、支持和適當的距離
- 不要因為別人的眼光而懷疑正常的友誼互動</textarea>
                <div class="word-count" id="wordCount1">0 字</div>
            </div>

            <!-- Topic 2: 愛情 -->
            <div class="topic-section">
                <div class="topic-label">
                    <i class="fas fa-heart"></i> 愛情篇 · 健康關係的基礎
                </div>
                <textarea class="notes-textarea" id="note2" placeholder="寫下你對愛情的理解和期待...
- 健康的愛情特質
- 溝通的重要性
- 愛情與友情的不同">- 愛情不是佔有，而是互相扶持和成長
- 健康的戀愛關係需要：信任、尊重、溝通、共同目標
- 不要用性行為來證明愛情，這是情感勒索</textarea>
                <div class="word-count" id="wordCount2">0 字</div>
            </div>

            <!-- Topic 3: 性與法律 -->
            <div class="topic-section">
                <div class="topic-label">
                    <i class="fas fa-gavel"></i> 性與法律篇 · 權益與保護
                </div>
                <textarea class="notes-textarea" id="note3" placeholder="記錄關於性知識和法律的要點...
- 法律對未成年的保護
- 自願與同意的意義
- 性侵犯的定義">- 與未滿16歲發生性行為是刑事犯罪，無論是否自願
- 性行為必須建立在雙方成熟、自願且能承擔後果的基礎上
- 性侵犯包括身體接觸和非身體接觸的騷擾</textarea>
                <div class="word-count" id="wordCount3">0 字</div>
            </div>

            <!-- Topic 4: 自我保護 -->
            <div class="topic-section">
                <div class="topic-label">
                    <i class="fas fa-shield-alt"></i> 自我保護篇 · 安全守則
                </div>
                <textarea class="notes-textarea" id="note4" placeholder="記錄保護自己的方法...
- 應對性誘惑的技巧
- 遇到危險時的三部曲
- 求助管道">- 面對性誘惑要堅定表達自己的界限
- 遇到性侵犯三步驟：保持冷靜 → 逃離現場 → 尋求幫助
- 不要因為害怕或羞恥而隱瞞受害經歷</textarea>
                <div class="word-count" id="wordCount4">0 字</div>
            </div>
        </div>

        <!-- Sticky Notes (Key Takeaways) - Blue theme -->
        <div class="sticky-notes-grid">
            <div class="sticky-note">
                <i class="fas fa-lightbulb"></i>
                <h4>核心觀念</h4>
                <p>尊重自己與他人的界限，是健康關係的基礎</p>
            </div>
            <div class="sticky-note">
                <i class="fas fa-exclamation-triangle"></i>
                <h4>法律紅線</h4>
                <p>未滿16歲的性行為都是犯罪，沒有例外</p>
            </div>
            <div class="sticky-note">
                <i class="fas fa-heartbeat"></i>
                <h4>情感提醒</h4>
                <p>真正的愛情不會用性來要脅或證明</p>
            </div>
            <div class="sticky-note">
                <i class="fas fa-phone-alt"></i>
                <h4>求助管道</h4>
                <p>113保護專線 · 學校輔導室 · 信任的師長</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="notes-actions">
            <button class="action-btn" id="saveNotes">
                <i class="fas fa-save"></i> 儲存筆記
            </button>
            <button class="action-btn" id="exportNotes">
                <i class="fas fa-file-export"></i> 匯出筆記
            </button>
                <button class="action-btn secondary" id="addImageNote">
                <i class="fas fa-image"></i> 加入圖片
            </button>
        </div>

        <!-- Quick stats -->
        <div style="display: flex; justify-content: space-between; color: #6b8baa; font-size:0.9rem; margin-top:1rem;">
            <span><i class="fas fa-pencil-alt"></i> 總字數: <span id="totalWords">0</span></span>
            <span><i class="fas fa-check-circle"></i> 最後編輯: <span id="lastEdited">剛剛</span></span>
        </div>
    </div>

    <!-- Footer with save status -->
    <div class="footer-note">
        <span class="save-status" id="saveStatus">
            <i class="fas fa-check-circle" style="color:#2ecc71;"></i> 已自動儲存
        </span>
        <span class="save-status">
            <i class="fas fa-lock" style="color:#3498db;"></i> 僅限個人檢視
        </span>
        <span class="save-status">
            <i class="fas fa-cloud"></i> 雲端同步
        </span>
    </div>
</div>

<!-- Modal for image note -->
<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <div class="modal-content">
        <i class="fas fa-camera" style="font-size: 4rem; color: #3498db; margin-bottom: 1rem;"></i>
        <h3 style="margin-bottom: 1rem; color:#1a4972;">加入圖片筆記</h3>
        <p style="margin-bottom: 2rem; color: #5a6263;">在實際應用中，這裡可以上傳圖片或手繪草稿</p>
        <button class="action-btn" style="display: inline-block; width: auto; padding:0.8rem 2rem;" onclick="document.getElementById('imageModal').style.display='none'">
            <i class="fas fa-check"></i> 我知道了
        </button>
    </div>
</div>

<script>
    (function() {
        // Back to index
        document.getElementById('backToIndexBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Get all textareas
        const textareas = document.querySelectorAll('.notes-textarea');
        const saveStatus = document.getElementById('saveStatus');
        const totalWordsSpan = document.getElementById('totalWords');
        const lastEditedSpan = document.getElementById('lastEdited');
        const progressFill = document.getElementById('progressFill');

        // Word count elements
        const wordCounts = [
            document.getElementById('wordCount1'),
            document.getElementById('wordCount2'),
            document.getElementById('wordCount3'),
            document.getElementById('wordCount4')
        ];

        // Calculate word count (Chinese characters count as words)
        function getWordCount(text) {
            // Remove extra spaces and count characters
            const trimmed = text.trim();
            if (trimmed.length === 0) return 0;
            return trimmed.length;
        }

        // Update all word counts
        function updateWordCounts() {
            let total = 0;
            textareas.forEach((textarea, index) => {
                const count = getWordCount(textarea.value);
                wordCounts[index].textContent = count + ' 字';
                total += count;
            });
            totalWordsSpan.textContent = total;
            
            // Update progress (example: 100 words per section as target)
            const totalPossible = 400; // 4 sections * 100 words target
            const percent = Math.min(100, Math.round((total / totalPossible) * 100));
            progressFill.style.width = percent + '%';
        }

        // Save notes functionality
        function saveAllNotes() {
            const notes = {};
            textareas.forEach((textarea, index) => {
                notes[`note_${index}`] = textarea.value;
            });
            localStorage.setItem('lesson3_notes_blue', JSON.stringify(notes));
            
            const now = new Date();
            const timeStr = now.getHours() + ':' + now.getMinutes().toString().padStart(2,'0');
            saveStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#2ecc71;"></i> 已儲存 ' + timeStr;
            saveStatus.style.background = '#d4e6f5';
            lastEditedSpan.textContent = timeStr;
            
            setTimeout(() => {
                saveStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#2ecc71;"></i> 已自動儲存';
            }, 3000);
            
            updateWordCounts();
        }

        // Load saved notes
        function loadNotes() {
            const saved = localStorage.getItem('lesson3_notes_blue');
            if (saved) {
                try {
                    const notes = JSON.parse(saved);
                    textareas.forEach((textarea, index) => {
                        if (notes[`note_${index}`]) {
                            textarea.value = notes[`note_${index}`];
                        }
                    });
                    saveStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#2ecc71;"></i> 已載入上次筆記';
                    updateWordCounts();
                } catch (e) {
                    console.error('Error loading notes:', e);
                }
            } else {
                // Set default content if no saved notes
                updateWordCounts();
            }
        }

        // Auto-save every 30 seconds
        setInterval(saveAllNotes, 30000);

        // Save on input
        textareas.forEach(textarea => {
            textarea.addEventListener('input', () => {
                saveStatus.innerHTML = '<i class="fas fa-spinner fa-pulse" style="color:#3498db;"></i> 儲存中...';
                setTimeout(saveAllNotes, 1000);
                updateWordCounts();
            });
        });

        // Manual save button
        document.getElementById('saveNotes').addEventListener('click', saveAllNotes);

        // Export notes
        document.getElementById('exportNotes').addEventListener('click', () => {
            let exportText = "=== 兩性關係學習筆記 ===\n\n";
            const topics = ['友情篇 · 互相尊重與信任', '愛情篇 · 健康關係的基礎', '性與法律篇 · 權益與保護', '自我保護篇 · 安全守則'];
            
            textareas.forEach((textarea, index) => {
                exportText += `【${topics[index]}】\n${textarea.value}\n\n`;
            });
            
            const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `兩性關係筆記_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            saveStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#2ecc71;"></i> 筆記已匯出';
        });

        
        // Add image note
        document.getElementById('addImageNote').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = 'block';
        });

        // Close modal
        document.querySelector('.close-modal').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === document.getElementById('imageModal')) {
                document.getElementById('imageModal').style.display = 'none';
            }
        });

        // Load saved notes on startup
        loadNotes();

        // Set today's date
        const today = new Date();
        const year = today.getFullYear();
        const month = (today.getMonth() + 1).toString().padStart(2, '0');
        const day = today.getDate().toString().padStart(2, '0');
        document.getElementById('currentDate').textContent = `${year}-${month}-${day}`;

        // Keyboard shortcut: Ctrl+S to save
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveAllNotes();
            }
        });

        // Initial word count
        updateWordCounts();
    })();
</script>

<!-- Additional blue theme styles -->
<style>
    /* Custom scrollbar for blue theme */
    .notes-textarea::-webkit-scrollbar {
        width: 8px;
    }
    
    .notes-textarea::-webkit-scrollbar-track {
        background: #e1edff;
        border-radius: 10px;
    }
    
    .notes-textarea::-webkit-scrollbar-thumb {
        background: #9bb7d1;
        border-radius: 10px;
    }
    
    .notes-textarea::-webkit-scrollbar-thumb:hover {
        background: #6b8baa;
    }
    
    /* Focus effects */
    .topic-label i {
        transition: transform 0.2s;
    }
    
    .topic-section:hover .topic-label i {
        transform: scale(1.2);
        color: #f39c12;
    }
    
    /* Save status animation */
    @keyframes pulse-blue {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
    }
    
    .fa-spinner {
        animation: pulse-blue 1.5s infinite;
    }
</style>
</body>
</html>
