<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Duolingo Exam • One by One • Full Sentences</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #dcf5e3 0%, #b8dcca 100%);
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .duo-card {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 48px;
      box-shadow: 0 30px 45px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .duo-header {
      background: #58cc71;
      padding: 1.2rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .logo h2 {
      color: white;
      font-weight: 900;
      font-size: 1.5rem;
    }
    .logo p {
      color: #fff5c4;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .score-progress {
      background: #1e3932;
      padding: 0.4rem 1rem;
      border-radius: 60px;
      color: #ffdf8c;
      font-weight: 800;
      text-align: center;
    }
    .question-area {
      padding: 2rem 2rem 1.5rem;
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-weight: 700;
      color: #3a6b42;
      font-size: 0.9rem;
    }
    .progress-bar-bg {
      background: #e0f0e3;
      border-radius: 30px;
      height: 10px;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .progress-fill {
      background: #58cc71;
      width: 0%;
      height: 100%;
      border-radius: 30px;
      transition: width 0.25s ease;
    }
    .question-card {
      background: #fefef5;
      border-radius: 32px;
      padding: 1.8rem;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      border: 1px solid #e2efdf;
    }
    .full-sentence {
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 600;
      color: #1f2f3a;
      margin-bottom: 1.8rem;
      background: #f9fff7;
      padding: 1rem;
      border-radius: 24px;
      border-left: 5px solid #58cc71;
    }
    .blank-highlight {
      display: inline-block;
      background: #fff2cf;
      border-radius: 20px;
      padding: 0.1rem 0.6rem;
      font-weight: 800;
      color: #c46d1a;
    }
    .answer-zone {
      margin: 1.5rem 0;
    }
    input.answer-input, select.answer-select {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      border-radius: 60px;
      border: 2px solid #cde2cd;
      font-family: 'Nunito', monospace;
      font-weight: 600;
      background: white;
      outline: none;
    }
    select.answer-select {
      cursor: pointer;
    }
    input.answer-input:focus, select.answer-select:focus {
      border-color: #58cc71;
      box-shadow: 0 0 0 3px rgba(88,204,113,0.2);
    }
    .feedback {
      margin-top: 1rem;
      font-weight: 700;
      padding: 0.6rem;
      border-radius: 40px;
      text-align: center;
      background: #f4f9f2;
    }
    .feedback.correct {
      background: #e1f7e6;
      color: #2b6e3c;
    }
    .feedback.wrong {
      background: #fff0ed;
      color: #c23b22;
    }
    .btn {
      background: #58cc71;
      border: none;
      width: 100%;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 800;
      color: white;
      border-radius: 60px;
      margin-top: 1.5rem;
      cursor: pointer;
      font-family: inherit;
      transition: 0.05s linear;
      box-shadow: 0 5px 0 #318a47;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #318a47;
    }
    .btn:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }
    .next-btn {
      background: #2b7a3e;
      box-shadow: 0 5px 0 #1b5729;
    }
    .restart-btn {
      background: #ffa845;
      box-shadow: 0 5px 0 #c46d1a;
      margin-top: 1rem;
    }
    footer {
      background: #f2faf0;
      text-align: center;
      padding: 1rem;
      font-size: 0.75rem;
      color: #56835e;
    }
    @media (max-width: 550px) {
      .question-area {
        padding: 1.2rem;
      }
      .full-sentence {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
<div class="duo-card" id="app">
  <div class="duo-header">
    <div class="logo">
      <h2>🦉 ENGLISH EXAM</h2>
      <p>one full sentence per blank · 50 questions</p>
    </div>
    <div class="score-progress" id="scoreDisplay">0 / 50 pts</div>
  </div>
  <div class="question-area">
    <div class="progress-text">
      <span id="qCounter">Question 1 / 50</span>
      <span id="pointsEarned">⭐ Score: 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div id="dynamicContent"></div>
  </div>
  <footer>📖 Each vocabulary blank shows the complete sentence. Type or choose the missing word.</footer>
</div>
