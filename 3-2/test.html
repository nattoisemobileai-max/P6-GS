<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 測驗 · 第三冊-第2課</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0.5rem;
            font-size: 18px;
        }

        .test-container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 1rem 0.8rem;
            box-shadow: 0 20px 30px -10px rgba(0,40,60,0.4);
        }

        .test-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-home:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b38f1c;
        }

        .test-title {
            font-size: 1.3rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
        }

        .test-stats {
            display: flex;
            gap: 0.5rem;
            background: #2b3c4e;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            align-items: center;
        }
        .test-stats i {
            color: #ffd966;
            margin-right: 2px;
        }

        /* 模式選擇區 */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
        }
        .mode-btn {
            background: white;
            border: 2px solid #3498db;
            border-radius: 40px;
            padding: 0.6rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            cursor: pointer;
            transition: 0.1s;
            flex: 1;
            max-width: 200px;
            box-shadow: 0 3px 0 #9fbad0;
        }
        .mode-btn.active {
            background: #3498db;
            color: white;
            border-color: #2c7bb6;
        }
        .mode-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9fbad0;
        }

        .progress-section {
            margin-bottom: 1rem;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #2c5a7a;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .progress-bar-bg {
            height: 12px;
            background: #e2eaf3;
            border-radius: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58cc71, #2e9b5c);
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s;
        }

        .question-panel {
            background: white;
            border-radius: 22px;
            padding: 1.5rem 1.2rem;
            margin: 1rem 0 1.5rem;
            border-left: 8px solid #3498db;
            box-shadow: 0 5px 0 #a0b9cf;
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .question-number {
            background: #3498db;
            color: white;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e3f5a;
            margin-bottom: 1.2rem;
            line-height: 1.4;
            border-left: 4px solid #f3b33d;
            padding-left: 0.8rem;
        }

        .options-area {
            margin: 1rem 0;
        }
        .option-item {
            background: #f5f9ff;
            border: 2px solid #cad9eb;
            border-radius: 40px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-item.selected {
            background: #c1e5c0;
            border-color: #58a700;
        }
        .option-item input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #58a700;
        }

        .btn-submit {
            background: #58a700;
            border: none;
            color: white;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #3e7a00;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #3e7a00;
        }

        .result-area {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 16px;
            background: #fff9e6;
            border-left: 6px solid #f3b33d;
            display: none;
        }
        .result-area.show {
            display: block;
        }
        .correct-msg {
            color: #2e7d32;
            font-weight: 700;
        }
        .incorrect-msg {
            color: #c62828;
            font-weight: 700;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .nav-btn {
            background: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #1f4973;
            box-shadow: 0 3px 0 #9fbad0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9fbad0;
        }
        .nav-btn.primary {
            background: #58a700;
            color: white;
            box-shadow: 0 3px 0 #3e7a00;
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .question-indicator {
            background: #e1edff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1a4972;
        }

        .footer-note {
            text-align: center;
            margin-top: 1rem;
            color: #6b8baa;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .test-header { flex-direction: column; align-items: stretch; }
            .back-home, .test-title, .test-stats { justify-content: center; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="test-container">
    <div class="test-header">
        <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="test-title" id="lesson-title">第三冊第2課·測驗</span>
        <div class="test-stats">
            <span><i class="fas fa-star"></i> <span id="score">0</span>/<span id="total">20</span></span>
        </div>
    </div>

    <!-- 模式選擇按鈕 -->
    <div class="mode-selector">
        <button class="mode-btn active" id="mode-random">隨機20題</button>
        <button class="mode-btn" id="mode-all">全部題目</button>
    </div>

    <div class="progress-section">
        <div class="progress-info">
            <span>第 <span id="current-q">1</span>/<span id="total-q">20</span> 題</span>
            <span><span id="correct-count">0</span> 正確 · <span id="wrong-count">0</span> 錯誤</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
    </div>

    <div id="question-panel" class="question-panel">
        <div class="question-header">
            <span class="question-number" id="q-number">第1題</span>
        </div>
        <div class="question-text" id="q-text">載入中...</div>
        <div class="options-area" id="options-area"></div>
        <button class="btn-submit" id="submit-btn">提交答案</button>
        <div class="result-area" id="result-area"></div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" id="prev-btn" disabled><i class="fas fa-chevron-left"></i> 上一題</button>
        <span class="question-indicator" id="indicator">1/20</span>
        <button class="nav-btn primary" id="next-btn" disabled>下一題 <i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="footer-note">
        <i class="fas fa-lightbulb"></i> 點擊選項後按提交查看解說
    </div>
</div>

<script>
    const JSON_FILE = 'source_data_test.json';
    let allQuestions = [];      // 完整題庫
    let currentQuestions = [];  // 目前測驗用的題目 (可能是全部或隨機20題)
    let currentIndex = 0;
    let userAnswers = {};       // 儲存每題的答案 (索引: 選擇的選項)
    let score = 0;
    let correctCount = 0;       // 答對題數
    let wrongCount = 0;         // 答錯題數
    let currentMode = 'random'; // 'random' 或 'all'

    async function loadData() {
        try {
            console.log('嘗試載入:', JSON_FILE);
            const response = await fetch(JSON_FILE);
            
            if (!response.ok) {
                throw new Error(`HTTP錯誤: ${response.status} - 找不到檔案 ${JSON_FILE}`);
            }
            
            const text = await response.text();
            console.log('原始JSON長度:', text.length);
            
            if (text.length === 0) {
                throw new Error('JSON檔案為空');
            }
            
            try {
                const data = JSON.parse(text);
                allQuestions = data.questions || [];
                
                if (allQuestions.length === 0) {
                    throw new Error('題目陣列為空');
                }
                
                document.getElementById('lesson-title').textContent = data.lessonTitle || '歷史測驗';
                document.getElementById('total').textContent = allQuestions.length;
                
                // 預設載入隨機20題
                selectRandomQuestions();
                
            } catch (parseError) {
                console.error('JSON解析錯誤:', parseError);
                console.error('前100字:', text.substring(0, 100));
                throw new Error('JSON格式錯誤：' + parseError.message);
            }
            
        } catch (e) {
            console.error('載入失敗:', e);
            document.getElementById('q-text').innerHTML = `
                <span style="color:#c62828;">❌ 載入失敗</span><br>
                <small>${e.message}</small><br>
                <small>請確認 <code>${JSON_FILE}</code> 存在且格式正確</small>
            `;
        }
    }

    // 選擇隨機20題
    function selectRandomQuestions() {
        if (allQuestions.length <= 20) {
            currentQuestions = [...allQuestions];
        } else {
            // 隨機選取20題
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 20);
        }
        currentMode = 'random';
        document.getElementById('mode-random').classList.add('active');
        document.getElementById('mode-all').classList.remove('active');
        document.getElementById('total-q').textContent = currentQuestions.length;
        document.getElementById('indicator').textContent = `1/${currentQuestions.length}`;
        
        resetTest();
    }

    // 選擇全部題目
    function selectAllQuestions() {
        currentQuestions = [...allQuestions];
        currentMode = 'all';
        document.getElementById('mode-all').classList.add('active');
        document.getElementById('mode-random').classList.remove('active');
        document.getElementById('total-q').textContent = currentQuestions.length;
        document.getElementById('indicator').textContent = `1/${currentQuestions.length}`;
        
        resetTest();
    }

    // 重設測驗
    function resetTest() {
        currentIndex = 0;
        userAnswers = {};
        score = 0;
        correctCount = 0;
        wrongCount = 0;
        
        document.getElementById('score').textContent = '0';
        document.getElementById('correct-count').textContent = '0';
        document.getElementById('wrong-count').textContent = '0';
        
        if (currentQuestions.length > 0) {
            renderQuestion();
            document.getElementById('next-btn').disabled = false;
            document.getElementById('submit-btn').disabled = false;
        }
        
        updateProgress();
    }

    function renderQuestion() {
        if (currentQuestions.length === 0) return;
        
        const q = currentQuestions[currentIndex];
        document.getElementById('q-number').textContent = `第${currentIndex+1}題`;
        document.getElementById('q-text').textContent = q.question;
        document.getElementById('indicator').textContent = `${currentIndex+1}/${currentQuestions.length}`;
        document.getElementById('current-q').textContent = currentIndex+1;

        let optsHtml = '';
        q.options.forEach((opt, idx) => {
            const checked = userAnswers[currentIndex] === idx ? 'checked' : '';
            optsHtml += `
                <label class="option-item ${userAnswers[currentIndex] === idx ? 'selected' : ''}">
                    <input type="radio" name="q-option" value="${idx}" ${checked} onchange="selectOption(${idx})">
                    ${opt}
                </label>
            `;
        });
        document.getElementById('options-area').innerHTML = optsHtml;

        document.getElementById('result-area').classList.remove('show');
        document.getElementById('result-area').innerHTML = '';
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        document.getElementById('next-btn').disabled = currentIndex === currentQuestions.length - 1;
    }

    window.selectOption = function(idx) {
        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll('.option-item input')[idx].parentElement.classList.add('selected');
        userAnswers[currentIndex] = idx;
    };

    document.getElementById('submit-btn').addEventListener('click', function() {
        const q = currentQuestions[currentIndex];
        const selected = userAnswers[currentIndex];
        
        if (selected === undefined) {
            alert('請先選擇一個答案！');
            return;
        }

        const isCorrect = (selected === q.correctAnswer);
        
        // 更新計分
        if (isCorrect) {
            score++;
            correctCount++;
        } else {
            wrongCount++;
        }
        
        document.getElementById('score').textContent = score;
        document.getElementById('correct-count').textContent = correctCount;
        document.getElementById('wrong-count').textContent = wrongCount;

        let resultHtml = `
            <p class="${isCorrect ? 'correct-msg' : 'incorrect-msg'}">
                ${isCorrect ? '✅ 答對了！' : '❌ 答錯了！'}
            </p>
            <p><strong>🔍 解說：</strong> ${q.explanation}</p>
        `;
        document.getElementById('result-area').innerHTML = resultHtml;
        document.getElementById('result-area').classList.add('show');

        updateProgress();
    });

    document.getElementById('prev-btn').addEventListener('click', function() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    });

    document.getElementById('next-btn').addEventListener('click', function() {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    });

    document.getElementById('mode-random').addEventListener('click', function() {
        if (currentMode !== 'random') {
            selectRandomQuestions();
        }
    });

    document.getElementById('mode-all').addEventListener('click', function() {
        if (currentMode !== 'all') {
            selectAllQuestions();
        }
    });

    function updateProgress() {
        const total = currentQuestions.length;
        const answered = Object.keys(userAnswers).length;
        const percent = Math.round((answered / total) * 100);
        document.getElementById('progress-fill').style.width = percent + '%';
    }

    window.onload = loadData;
</script>
</body>
</html>
