<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · 測驗 · 第一冊::處變不驚 第4課</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* [Keep all your existing CSS styles exactly as they are] */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .test-container {
            max-width: 800px;
            width: 100%;
            height: 95vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 30px;
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1f3a4b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .title {
            font-weight: 800;
            color: #1a4972;
        }

        .stats {
            background: #2b3c4e;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        .filter-btn {
            background: #f0f2f5;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c5a7a;
            cursor: pointer;
            transition: 0.1s;
        }

        .filter-btn.active {
            background: #3498db;
            color: white;
        }

        .progress-bar {
            height: 8px;
            background: #e0e7ef;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            overflow: hidden;
            flex-shrink: 0;
        }

        .progress-fill {
            height: 100%;
            background: #58cc71;
            width: 0%;
            transition: width 0.2s;
        }

        .question-area {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        .question-card {
            background: #f8fafd;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid #e0e8f0;
        }

        .question-header {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .q-num {
            background: #3498db;
            color: white;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .q-type {
            background: #f4d03f;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .q-section {
            background: #e1f0fa;
            color: #1a4972;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid #9bb7d1;
        }

        .q-text {
            font-size: 1rem;
            font-weight: 600;
            color: #1f3a4b;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .option {
            background: white;
            border: 1px solid #d0dcec;
            border-radius: 30px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .option:hover {
            background: #f0f7ff;
        }

        .option input {
            width: 18px;
            height: 18px;
        }

        .option.correct {
            background: #e3f5e3;
            border-color: #58cc71;
        }

        .option.incorrect {
            background: #ffe8e8;
            border-color: #ff6b6b;
        }

        .option.disabled {
            opacity: 0.7;
            cursor: default;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #d0dcec;
            border-radius: 16px;
            font-size: 0.95rem;
            margin: 0.5rem 0;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            background: #58a700;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: fit-content;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn.secondary {
            background: #e67e22;
        }

        .explain-box {
            background: #fff9e6;
            border-left: 4px solid #f3b33d;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        /* 總結畫面 */
        .summary-section {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid #e0e8f0;
            overflow-y: auto;
            max-height: 100%;
        }

        .summary-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1a4972;
            margin-bottom: 1rem;
        }

        .summary-icon {
            font-size: 3rem;
            color: #f3b33d;
            margin-bottom: 1rem;
        }

        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .stat-box {
            text-align: center;
            min-width: 80px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 900;
            color: #1a4972;
        }

        .stat-label {
            color: #4f6f8f;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* 章節進度卡片 */
        .section-progress {
            background: #f0f7ff;
            border-radius: 16px;
            padding: 1.2rem;
            margin: 1.5rem 0;
            text-align: left;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a4972;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .section-card {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            border-left: 4px solid #3498db;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .section-name {
            font-weight: 700;
            color: #1f3a4b;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .section-progress-bar {
            height: 6px;
            background: #e0e7ef;
            border-radius: 10px;
            margin: 0.5rem 0;
            overflow: hidden;
        }

        .section-progress-fill {
            height: 100%;
            background: #58cc71;
            width: 0%;
            border-radius: 10px;
        }

        .section-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #4f6f8f;
        }

        .summary-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-shrink: 0;
        }

        .nav-btn {
            background: white;
            border: 1px solid #d0dcec;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            color: #1f4973;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .nav-btn.primary {
            background: #58a700;
            color: white;
            border: none;
        }

        .counter {
            background: #e1edff;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            color: #1a4972;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="test-container">
    <div class="top-bar">
        <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="title" id="lesson-title">測驗</span>
        <span class="stats"><span id="score">0</span>/<span id="total">0</span></span>
    </div>

    <div class="filters" id="filter-buttons">
        <button class="filter-btn active" data-filter="random20">🎲 隨機20</button>
        <button class="filter-btn" data-filter="all">📚 全部</button>
        <button class="filter-btn" data-filter="mc">🔘 單選</button>
        <button class="filter-btn" data-filter="checkbox">✅ 複選</button>
        <button class="filter-btn" data-filter="truefalse">✓ 是非</button>
        <button class="filter-btn" data-filter="essay">📝 論述</button>
        <button class="filter-btn" data-filter="short">✏️ 簡答</button>
        <button class="filter-btn" data-filter="case">📋 案例</button>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-area" id="questionArea"></div>

    <!-- 總結畫面 (預設隱藏) -->
    <div id="summarySection" class="summary-section hidden">
        <div class="summary-icon"><i class="fas fa-trophy"></i></div>
        <div class="summary-title" id="summaryTitle">測驗完成！</div>
        
        <div class="summary-stats">
            <div class="stat-box">
                <div class="stat-number" id="summaryCorrect">0</div>
                <div class="stat-label">正確</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="summaryWrong">0</div>
                <div class="stat-label">錯誤</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="summaryTotal">0</div>
                <div class="stat-label">總題數</div>
            </div>
        </div>

        <!-- 章節完成度 -->
        <div class="section-progress" id="sectionProgress">
            <div class="section-title">
                <i class="fas fa-book-open"></i> 章節學習進度
            </div>
            <div class="section-grid" id="sectionGrid"></div>
        </div>

        <div class="summary-buttons" id="summaryButtons"></div>
    </div>

    <div class="nav">
        <button class="nav-btn" id="prevBtn" disabled>◀ 上一題</button>
        <span class="counter" id="counter">1/0</span>
        <button class="nav-btn primary" id="nextBtn" disabled>下一題 ▶</button>
    </div>
</div>

<script>
    let allQuestions = [];
    let currentQuestions = [];
    let userAnswers = {};
    let answeredStatus = {};
    let completedCount = 0, wrongCount = 0;
    let currentIndex = 0;

    const questionArea = document.getElementById('questionArea');
    const summarySection = document.getElementById('summarySection');
    const sectionGrid = document.getElementById('sectionGrid');
    const lessonTitle = document.getElementById('lesson-title');
    const scoreSpan = document.getElementById('score');
    const totalSpan = document.getElementById('total');
    const progressFill = document.getElementById('progressFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counter');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const summaryCorrect = document.getElementById('summaryCorrect');
    const summaryWrong = document.getElementById('summaryWrong');
    const summaryTotal = document.getElementById('summaryTotal');
    const summaryButtons = document.getElementById('summaryButtons');
    const summaryTitle = document.getElementById('summaryTitle');

    async function loadQuestions() {
        try {
            // ✅ FIXED: Changed from 'test-data.json' to 'test.json'
            const res = await fetch('test.json');
            if (!res.ok) throw new Error('載入失敗');
            const data = await res.json();
            
            allQuestions = data.questions || [];
            lessonTitle.textContent = data.lessonTitle || '測驗';
            totalSpan.textContent = allQuestions.length;
            
            filterQuestions('random20');
            
        } catch (error) {
            questionArea.innerHTML = `<div style="color:red; padding:2rem;">❌ 載入失敗</div>`;
        }
    }

    function getTypeName(type) {
        const map = {
            'mc': '單選', 'checkbox': '複選', 'truefalse': '是非',
            'essay': '論述', 'short': '簡答', 'case': '案例'
        };
        return map[type] || type;
    }

    function getSectionDisplay(section) {
        if (!section) return '';
        // 移除頁碼標記 [Pxx] 只保留章節名稱
        return section.replace(/\s*\[.*?\]\s*/g, '');
    }

    function filterQuestions(filterType) {
        filterBtns.forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === filterType) btn.classList.add('active');
        });

        let indices = [];
        
        if (filterType === 'random20') {
            const total = allQuestions.length;
            const count = Math.min(20, total);
            const set = new Set();
            while (set.size < count) set.add(Math.floor(Math.random() * total));
            indices = Array.from(set);
        } else if (filterType === 'all') {
            indices = allQuestions.map((_, i) => i);
        } else {
            indices = allQuestions
                .map((q, i) => q.type === filterType ? i : null)
                .filter(i => i !== null);
        }

        currentQuestions = indices;
        userAnswers = {};
        answeredStatus = {};
        completedCount = 0;
        wrongCount = 0;
        currentIndex = 0;
        
        summarySection.classList.add('hidden');
        questionArea.classList.remove('hidden');
        
        updateProgress();

        if (currentQuestions.length === 0) {
            questionArea.innerHTML = '<div style="text-align:center; padding:2rem;">📭 暫無題目</div>';
            counter.textContent = '0/0';
            nextBtn.disabled = true;
            prevBtn.disabled = true;
            return;
        }

        counter.textContent = `1/${currentQuestions.length}`;
        nextBtn.disabled = false;
        renderQuestion(0);
    }

    function renderQuestion(index) {
        const qIdx = currentQuestions[index];
        const q = allQuestions[qIdx];
        const answered = answeredStatus[index] === true;
        
        let html = `
            <div class="question-card">
                <div class="question-header">
                    <span class="q-num">${index+1}/${currentQuestions.length}</span>
                    <span class="q-type">${getTypeName(q.type)}</span>
                    ${q.section ? `<span class="q-section">${getSectionDisplay(q.section)}</span>` : ''}
                </div>
                <div class="q-text">${q.question.replace(/\n/g, '<br>')}</div>
        `;

        if (['mc', 'checkbox', 'truefalse'].includes(q.type)) {
            let options = q.options || (q.type === 'truefalse' ? ['正確', '錯誤'] : []);
            
            html += '<div class="options">';
            options.forEach((opt, i) => {
                let checked = '';
                let extraClass = '';
                let disabled = answered ? 'disabled' : '';
                
                if (answered && userAnswers[index]) {
                    const selected = userAnswers[index].selected;
                    if (Array.isArray(selected) ? selected.includes(i) : selected === i) {
                        checked = 'checked';
                    }
                    
                    if (q.type === 'checkbox') {
                        if (Array.isArray(q.correctAnswer) && q.correctAnswer.includes(i)) {
                            extraClass = ' correct';
                        }
                    } else if (q.type === 'truefalse') {
                        if ((i === 0 && q.correctAnswer === true) || (i === 1 && q.correctAnswer === false)) {
                            extraClass = ' correct';
                        }
                    } else {
                        if (q.correctAnswer === i) extraClass = ' correct';
                    }
                    
                    if (userAnswers[index].isCorrect === false) {
                        if (Array.isArray(selected) && selected.includes(i) && 
                            !(Array.isArray(q.correctAnswer) && q.correctAnswer.includes(i))) {
                            extraClass = ' incorrect';
                        } else if (!Array.isArray(selected) && selected === i && 
                                  ((q.type === 'truefalse' && ((i === 0 && q.correctAnswer !== true) || (i === 1 && q.correctAnswer !== false))) ||
                                   (q.type !== 'truefalse' && selected !== q.correctAnswer))) {
                            extraClass = ' incorrect';
                        }
                    }
                }
                
                html += `
                    <label class="option ${disabled} ${extraClass}">
                        <input type="${q.type === 'checkbox' ? 'checkbox' : 'radio'}" 
                               name="q${index}" value="${i}" ${checked} 
                               ${disabled}
                               onchange="${q.type === 'checkbox' 
                                   ? `handleCheckboxChange(${index}, ${i}, this)` 
                                   : `handleRadioChange(${index}, ${i})`}">
                        ${opt}
                    </label>
                `;
            });
            html += '</div>';
            
            if (q.type === 'checkbox' && !answered) {
                html += `<button class="btn" onclick="submitCheckbox(${index})">提交答案</button>`;
            }
            
        } else {
            html += `<textarea id="input-${index}" placeholder="請輸入答案..." ${answered ? 'disabled' : ''}>${userAnswers[index]?.selected || ''}</textarea>`;
            if (!answered) {
                html += `<button class="btn" onclick="submitText(${index})">提交答案</button>`;
            }
        }

        if (answered) {
            html += '<div class="explain-box">';
            const isCorrect = userAnswers[index]?.isCorrect;
            
            if (['mc', 'checkbox', 'truefalse'].includes(q.type)) {
                html += isCorrect ? '✅ 正確！' : '❌ 錯誤！';
            } else {
                html += '📝 已提交，請對照參考答案';
            }
            
            if (q.referenceAnswer) {
                html += `<br><br><strong>參考答案：</strong><br>${q.referenceAnswer.replace(/\n/g, '<br>')}`;
            }
            if (q.explanation) {
                html += `<br><br><strong>解說：</strong><br>${q.explanation.replace(/\n/g, '<br>')}`;
            }
            html += '</div>';
        }

        html += '</div>';
        questionArea.innerHTML = html;

        counter.textContent = `${index+1}/${currentQuestions.length}`;
        prevBtn.disabled = index === 0;
    }

    window.handleRadioChange = function(index, value) {
        if (answeredStatus[index]) return;
        
        const selectedValue = parseInt(value);
        const qIdx = currentQuestions[index];
        const q = allQuestions[qIdx];
        
        let isCorrect = false;
        if (q.type === 'truefalse') {
            isCorrect = (selectedValue === 0 && q.correctAnswer === true) || 
                        (selectedValue === 1 && q.correctAnswer === false);
        } else {
            isCorrect = (selectedValue === q.correctAnswer);
        }
        
        userAnswers[index] = {
            selected: selectedValue,
            isCorrect: isCorrect
        };
        
        answeredStatus[index] = true;
        if (isCorrect) completedCount++; else wrongCount++;
        updateProgress();
        checkAllAnswered();
        renderQuestion(index);
    };

    window.handleCheckboxChange = function(index, value, cb) {
        if (answeredStatus[index]) return;
        if (!userAnswers[index]) userAnswers[index] = [];
        
        if (cb.checked) {
            userAnswers[index].push(parseInt(value));
        } else {
            userAnswers[index] = userAnswers[index].filter(v => v !== parseInt(value));
        }
    };

    window.submitCheckbox = function(index) {
        if (answeredStatus[index] || !userAnswers[index]?.length) return;
        
        const q = allQuestions[currentQuestions[index]];
        const correct = q.correctAnswer.map(v => parseInt(v));
        const selected = userAnswers[index].map(v => parseInt(v));
        const isCorrect = selected.length === correct.length &&
            selected.every(v => correct.includes(v));
        
        userAnswers[index] = { selected, isCorrect };
        answeredStatus[index] = true;
        if (isCorrect) completedCount++; else wrongCount++;
        updateProgress();
        checkAllAnswered();
        renderQuestion(index);
    };

    window.submitText = function(index) {
        const input = document.getElementById(`input-${index}`);
        if (!input?.value.trim()) return;
        
        userAnswers[index] = { selected: input.value, isCorrect: false };
        answeredStatus[index] = true;
        wrongCount++;
        updateProgress();
        checkAllAnswered();
        renderQuestion(index);
    };

    function updateProgress() {
        const totalAnswered = Object.keys(answeredStatus).length;
        const percent = currentQuestions.length ? (totalAnswered / currentQuestions.length) * 100 : 0;
        progressFill.style.width = percent + '%';
        scoreSpan.textContent = completedCount;
    }

    function checkAllAnswered() {
        const totalAnswered = Object.keys(answeredStatus).length;
        if (totalAnswered === currentQuestions.length) {
            showSummary();
        }
    }

    function showSummary() {
        questionArea.classList.add('hidden');
        summarySection.classList.remove('hidden');
        
        const totalCorrect = completedCount;
        const totalWrong = wrongCount;
        const total = currentQuestions.length;
        
        summaryCorrect.textContent = totalCorrect;
        summaryWrong.textContent = totalWrong;
        summaryTotal.textContent = total;
        
        summaryTitle.innerHTML = totalWrong === 0 ? '🎉 恭喜你！全部答對！' : '📊 測驗總結';
        
        // 計算各章節完成度
        const sectionStats = {};
        
        for (let i = 0; i < currentQuestions.length; i++) {
            const qIdx = currentQuestions[i];
            const q = allQuestions[qIdx];
            const section = q.section || '未分類';
            
            if (!sectionStats[section]) {
                sectionStats[section] = { total: 0, correct: 0, wrong: 0 };
            }
            
            sectionStats[section].total++;
            
            if (answeredStatus[i]) {
                if (userAnswers[i]?.isCorrect) {
                    sectionStats[section].correct++;
                } else {
                    sectionStats[section].wrong++;
                }
            }
        }
        
        // 產生章節進度卡片
        let sectionHtml = '';
        Object.keys(sectionStats).sort().forEach(section => {
            const stat = sectionStats[section];
            const percent = stat.total ? Math.round((stat.correct / stat.total) * 100) : 0;
            const displayName = getSectionDisplay(section);
            
            sectionHtml += `
                <div class="section-card">
                    <div class="section-name">${displayName || '未分類'}</div>
                    <div class="section-progress-bar">
                        <div class="section-progress-fill" style="width: ${percent}%;"></div>
                    </div>
                    <div class="section-stats">
                        <span>✅ ${stat.correct}</span>
                        <span>❌ ${stat.wrong}</span>
                        <span>📋 ${stat.total}題</span>
                    </div>
                </div>
            `;
        });
        
        sectionGrid.innerHTML = sectionHtml || '<div style="text-align:center; padding:1rem;">暫無章節資料</div>';
        
        // 產生按鈕
        let buttonsHtml = '';
        if (totalWrong > 0) {
            buttonsHtml += `<button class="btn secondary" onclick="retryWrongQuestions()">🔁 重做錯題</button>`;
        }
        buttonsHtml += `<button class="btn" onclick="retryAllQuestions()">🔄 重新測驗</button>`;
        summaryButtons.innerHTML = buttonsHtml;
    }

    window.retryWrongQuestions = function() {
        const wrongIndices = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            if (userAnswers[i] && userAnswers[i].isCorrect === false) {
                wrongIndices.push(currentQuestions[i]);
            }
        }
        
        if (wrongIndices.length === 0) return;
        
        currentQuestions = wrongIndices;
        userAnswers = {};
        answeredStatus = {};
        completedCount = 0;
        wrongCount = 0;
        currentIndex = 0;
        
        summarySection.classList.add('hidden');
        questionArea.classList.remove('hidden');
        
        updateProgress();
        counter.textContent = `1/${currentQuestions.length}`;
        nextBtn.disabled = false;
        renderQuestion(0);
    };

    window.retryAllQuestions = function() {
        const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
        filterQuestions(activeFilter);
    };

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        }
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => filterQuestions(btn.dataset.filter));
    });

    loadQuestions();
</script>
</body>
</html>
