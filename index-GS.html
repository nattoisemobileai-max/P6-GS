<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常識學堂 · 學習模式</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 全域樣式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
        }

        .app-container {
            max-width: 1200px;      /* 筆電/大螢幕最大寬度 */
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0,20,40,0.2);
        }

        /* 頂部列 (橫向排列，大螢幕不換行) */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 0 #bed0e3;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .user-greeting {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #eef5ff;
            padding: 0.3rem 1rem 0.3rem 0.6rem;
            border-radius: 40px;
            border: 1px solid #c1d9f0;
        }
        .user-greeting i {
            font-size: 1.8rem;
            color: #1c8d7c;
            background: white;
            border-radius: 50%;
            padding: 0.2rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .user-greeting span {
            font-weight: 800;
            font-size: 1.3rem;
            color: #1f2d3d;
        }
        .user-greeting .sub {
            font-size: 1rem;
            font-weight: 500;
            color: #4f6f8f;
            margin-left: 2px;
        }

        .quote-ticker {
            flex: 1;
            min-width: 250px;
            background: #fff9e0;
            border-radius: 50px;
            padding: 0.4rem 1.2rem;
            border: 1px dashed #f3b33d;
            overflow: hidden;
            white-space: nowrap;
        }
        .quote-scroll {
            display: inline-block;
            white-space: nowrap;
            font-style: italic;
            font-weight: 500;
            color: #9b6b00;
            font-size: 1.1rem;
            animation: scrollRightLeft 14s cubic-bezier(0.2, 0.9, 0.3, 1) 2 forwards;
        }
        @keyframes scrollRightLeft {
            0% { transform: translateX(100%); }
            25% { transform: translateX(20%); }
            50% { transform: translateX(-20%); }
            75% { transform: translateX(-80%); }
            100% { transform: translateX(-150%); }
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #2b3c4e;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: white;
            box-shadow: 0 4px 0 #0f1a24;
        }
        .xp-badge {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: #ffd966;
            color: #2f2f2f;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.1rem;
        }
        .xp-badge i { color: #f09b22; }
        .level-badge {
            background: white;
            color: #1f3a4b;
            font-weight: 800;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 1.1rem;
        }

        /* 書籍網格 (在大螢幕上可橫排，小螢幕縱排) */
        .books-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            margin-top: 2rem;
        }
        @media (min-width: 768px) {
            .books-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                align-items: start;
            }
        }
        @media (min-width: 1024px) {
            .books-grid {
                grid-template-columns: repeat(3, 1fr);  /* 三冊並排 */
            }
        }

        .book-card {
            background: white;
            border-radius: 30px;
            padding: 1.8rem 1.5rem;
            box-shadow: 0 8px 0 #b3c9da, 0 15px 25px -8px rgba(60,80,100,0.3);
            border: 2px solid rgba(255,255,255,0.9);
            height: fit-content;
        }

        .book-title {
            font-size: 2rem;
            font-weight: 900;
            color: #2f5575;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .book-title i { font-size: 2rem; color: #58a700; }
        .book-sub {
            font-size: 1.1rem;
            color: #4b6d8c;
            margin-bottom: 1.2rem;
            border-bottom: 2px dotted #c6d9eb;
            padding-bottom: 0.5rem;
            font-weight: 600;
        }

        .lesson-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .lesson-btn {
            background: #f0f6ff;
            border: 2px solid #c4d5e8;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f4973;
            box-shadow: 0 4px 0 #9fbad0;
            cursor: pointer;
            transition: 0.06s linear;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1 1 auto;
            justify-content: center;
            min-width: 130px;
            border: none;
        }
        .lesson-btn i { font-size: 1.2rem; color: #ffa41b; }
        .lesson-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9fbad0; }

        /* 學習模式面板 */
        .mode-panel {
            background: white;
            border-radius: 30px;
            padding: 1.8rem 1.5rem;
            margin: 2rem 0 1rem;
            box-shadow: 0 8px 0 #b3c9da;
            border: 2px solid #fff6cf;
            display: none;
        }
        .mode-panel.active { display: block; }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px dashed #9bb7d1;
        }
        .panel-header h3 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a4972;
        }
        .close-panel {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #e74c3c;
            line-height: 1;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }
        @media (min-width: 600px) {
            .mode-grid { grid-template-columns: repeat(4, 1fr); }  /* 平板/電腦四模式一排 */
        }

        .mode-card {
            background: #f5f9ff;
            border: 2px solid #cad9eb;
            border-radius: 24px;
            padding: 1.2rem 0.5rem;
            text-align: center;
            text-decoration: none;
            color: #1f4973;
            transition: 0.1s;
            box-shadow: 0 4px 0 #9fbad0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .mode-card:active { transform: translateY(4px); box-shadow: 0 1px 0 #9fbad0; }
        .mode-card i { font-size: 2.2rem; color: #3498db; }
        .mode-card span { font-weight: 700; font-size: 1rem; }

        .footer-credit {
            margin-top: 2rem;
            text-align: center;
            color: #6b8baa;
            font-weight: 600;
            font-size: 1rem;
        }

        /* 手機微調 */
        @media (max-width: 480px) {
            .app-container { padding: 1rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .user-greeting, .quote-ticker, .stats { width: 100%; justify-content: center; }
            .panel-header h3 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 頂部列 -->
    <div class="top-bar">
        <div class="user-greeting">
            <i class="fas fa-user-astronaut"></i>
            <span>Hi, 小子!</span>
            <span class="sub">🌟 小常識</span>
        </div>
        <div class="quote-ticker">
            <span class="quote-scroll" id="quoteSpan">
                <i class="fas fa-quote-left"></i> 知識就是力量 · 培根  <i class="fas fa-quote-right"></i>  學而不思則罔 · 孔子   ❝ 想像力比知識更重要 ❞ —— 愛因斯坦
            </span>
        </div>
        <div class="stats">
            <div class="xp-badge"><i class="fas fa-star"></i> 1,280 XP</div>
            <div class="level-badge">Lv. 9</div>
        </div>
    </div>

    <!-- 書籍網格 -->
    <div class="books-grid">
        <!-- 第一冊 -->
        <div class="book-card">
            <div class="book-title"><i class="fas fa-shield-alt"></i> 第一冊::處變不驚</div>
            <div class="book-sub">共 3 課</div>
            <div class="lesson-grid">
                <button class="lesson-btn" data-book="第一冊" data-lesson="第3課-兩性關係"><i class="fas fa-heart-broken"></i> 第3課-兩性關係</button>
                <button class="lesson-btn" data-book="第一冊" data-lesson="第4課-情緒和壓力"><i class="fas fa-smile"></i> 第4課-情緒和壓力</button>
                <button class="lesson-btn" data-book="第一冊" data-lesson="第5課-活出彩虹"><i class="fas fa-rainbow"></i> 第5課-活出彩虹</button>
            </div>
        </div>
        <!-- 第三冊 -->
        <div class="book-card">
            <div class="book-title"><i class="fas fa-dragon"></i> 第三冊::中國的變遷</div>
            <div class="book-sub">共 4 課</div>
            <div class="lesson-grid">
                <button class="lesson-btn" data-book="第三冊" data-lesson="第1課-最後的皇朝"><i class="fas fa-crown"></i> 第1課-最後的皇朝</button>
                <button class="lesson-btn" data-book="第三冊" data-lesson="第2課-內外交困的時期"><i class="fas fa-fist-raised"></i> 第2課-內外交困的時期</button>
                <button class="lesson-btn" data-book="第三冊" data-lesson="第3課-改革開放前後"><i class="fas fa-chart-line"></i> 第3課-改革開放前後</button>
                <button class="lesson-btn" data-book="第三冊" data-lesson="第4課-中國近年發展"><i class="fas fa-city"></i> 第4課-中國近年發展</button>
            </div>
        </div>
        <!-- 時事新聞 -->
        <div class="book-card">
            <div class="book-title"><i class="fas fa-newspaper"></i> 時事新聞</div>
            <div class="book-sub">共 3 個主題</div>
            <div class="lesson-grid">
                <button class="lesson-btn" data-book="時事" data-lesson="國際時事"><i class="fas fa-globe-asia"></i> 國際時事</button>
                <button class="lesson-btn" data-book="時事" data-lesson="本地要聞"><i class="fas fa-home"></i> 本地要聞</button>
                <button class="lesson-btn" data-book="時事" data-lesson="科技新知"><i class="fas fa-flask"></i> 科技新知</button>
            </div>
        </div>
    </div>

    <!-- 學習模式面板 (點擊課堂後顯示) -->
    <div id="modePanel" class="mode-panel">
        <div class="panel-header">
            <h3 id="selectedLessonTitle">第3課-兩性關係</h3>
            <button class="close-panel" id="closePanelBtn"><i class="fas fa-times-circle"></i></button>
        </div>
        <div class="mode-grid" id="modeLinks"></div>
    </div>

    <div class="footer-credit">⚡ 每日常識 · 小習慣大智慧</div>
</div>

<script>
    (function() {
        // 金句滾動 (兩次後停止)
        const quoteSpan = document.getElementById('quoteSpan');
        let animCount = 0;
        quoteSpan.addEventListener('animationiteration', () => {
            animCount++;
            if (animCount === 2) {
                quoteSpan.style.animation = 'none';
                quoteSpan.style.transform = 'translateX(0%)';
            }
        });
        setTimeout(() => {
            quoteSpan.style.animation = 'none';
            quoteSpan.style.transform = 'translateX(0%)';
        }, 18000);

        const lessonBtns = document.querySelectorAll('.lesson-btn');
        const modePanel = document.getElementById('modePanel');
        const selectedTitle = document.getElementById('selectedLessonTitle');
        const modeLinks = document.getElementById('modeLinks');
        const closeBtn = document.getElementById('closePanelBtn');

        const modes = [
            { name: 'Test', icon: 'fas fa-pencil-alt', file: 'test.html' },
            { name: 'Cheatsheet', icon: 'fas fa-list-alt', file: 'cheatsheet.html' },
            { name: 'Summary', icon: 'fas fa-compress-alt', file: 'summary.html' },
            { name: 'Selfnotes', icon: 'fas fa-pen-fancy', file: 'selfnotes.html' }
        ];

        lessonBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const book = this.dataset.book;
                const lesson = this.dataset.lesson;
                selectedTitle.textContent = `${book} · ${lesson}`;

                // 產生資料夾名稱 (用於連結)
                let folder = '';
                if (book === '第一冊') {
                    const match = lesson.match(/第(\d+)課/);
                    if (match) folder = `1-${match[1]}`;
                } else if (book === '第三冊') {
                    const match = lesson.match(/第(\d+)課/);
                    if (match) folder = `3-${match[1]}`;
                } else if (book === '時事') {
                    folder = 'news';
                }

                let html = '';
                modes.forEach(m => {
                    const link = folder ? `${folder}/${m.file}` : m.file;
                    html += `<a href="${link}" class="mode-card"><i class="${m.icon}"></i><span>${m.name}</span></a>`;
                });
                modeLinks.innerHTML = html;
                modePanel.classList.add('active');
            });
        });

        closeBtn.addEventListener('click', () => modePanel.classList.remove('active'));
        window.addEventListener('click', (e) => {
            if (!modePanel.contains(e.target) && !e.target.classList.contains('lesson-btn')) {
                modePanel.classList.remove('active');
            }
        });
    })();
</script>
</body>
</html>
